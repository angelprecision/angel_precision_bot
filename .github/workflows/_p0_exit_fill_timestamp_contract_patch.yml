name: One-shot P0 EXIT fill timestamp contract patch

on:
  push:
    branches:
      - fix/p0-exit-fill-timestamp-contract-20260910
    paths:
      - .github/workflows/_p0_exit_fill_timestamp_contract_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-exit-fill-timestamp-contract-20260910
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply exact surgical patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              assert count == 1, f"{path}: expected exactly one replacement target, found {count}"
              p.write_text(text.replace(old, new, 1))

          def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              p = Path(path)
              text = p.read_text()
              assert text.count(start) == 1, f"{path}: start marker count != 1: {start!r}"
              i = text.index(start)
              j = text.index(end, i)
              p.write_text(text[:i] + replacement + text[j:])

          # -----------------------------------------------------------------
          # ap_reconciler.py: propagate exact broker fill timestamp at every
          # reconciler EXIT-fill producer and report HOLD truth explicitly.
          # -----------------------------------------------------------------
          replace_once(
              "ap_reconciler.py",
              "from datetime import datetime, timezone\nfrom typing import Optional\n\nlog = logging.getLogger(\"ap.reconciler\")",
              "from datetime import datetime, timezone\nfrom typing import Optional\n\nfrom ap.manual_close_reconciliation import BROKER_FILL_TIMESTAMP_KEYS, order_filled_at\n\nlog = logging.getLogger(\"ap.reconciler\")",
          )

          replace_once(
              "ap_reconciler.py",
              "\n\n_HISTORICAL_UNDERLYING_KEYS = (",
              '''\n\ndef _extract_broker_fill_timestamp(raw: dict) -> Optional[str]:
              """Return only an explicit timezone-aware broker execution timestamp."""
              try:
                  filled_at = order_filled_at(raw)
              except Exception:
                  return None
              if not isinstance(filled_at, datetime):
                  return None
              try:
                  if filled_at.tzinfo is None or filled_at.utcoffset() is None:
                      return None
                  return filled_at.astimezone(timezone.utc).isoformat()
              except Exception:
                  return None


          _HISTORICAL_UNDERLYING_KEYS = (''',
          )

          replace_between(
              "ap_reconciler.py",
              "    def _apply_osm_fill_update(\n",
              "    def _handle_stale_acknowledged_exits(",
              '''    def _apply_osm_fill_update(
                  self,
                  local_id: str,
                  status: str,
                  filled_qty: int,
                  fill_price: float,
                  broker_order_id: str | None = None,
                  filled_ts: str | None = None,
              ) -> bool:
                  """Compatibility bridge for OSM v3 apply_fill_update()."""
                  status_u = str(status or "").upper()
                  apply_fn = getattr(self.osm, "apply_fill_update", None)
                  if callable(apply_fn) and status_u in {"PARTIAL_FILL", "EXIT_PARTIAL_FILL"}:
                      try:
                          return bool(apply_fn(
                              local_id,
                              cumulative_filled=int(filled_qty),
                              fill_price=float(fill_price) if fill_price is not None else None,
                              broker_order_id=broker_order_id,
                              filled_ts=filled_ts,
                          ))
                      except TypeError as te:
                          log.warning(
                              "[%s] OSM apply_fill_update signature mismatch for %s; falling back to transition(): %s",
                              self.client_id, local_id, te,
                          )
                  return bool(self.osm.transition(
                      local_id,
                      status_u,
                      filled_qty=int(filled_qty),
                      fill_price=float(fill_price) if fill_price is not None else None,
                      broker_order_id=broker_order_id,
                      filled_ts=filled_ts,
                  ))

              def _hold_exit_fill_timestamp_missing(
                  self,
                  summary: dict,
                  *,
                  order: dict,
                  evidence: dict,
                  broker_status: str,
                  source: str,
                  filled_qty,
                  fill_price,
                  broker_order_id: str | None = None,
              ) -> None:
                  timestamp_fields = {
                      key: evidence.get(key)
                      for key in BROKER_FILL_TIMESTAMP_KEYS
                      if key in evidence
                  }
                  local_id = order.get("local_order_id") or order.get("id") or "?"
                  position_id = order.get("position_id") or order.get("positionId") or "?"
                  contract = order.get("contract") or order.get("symbol") or "?"
                  durable_status = order.get("status") or "?"
                  broker_id = (
                      broker_order_id
                      or evidence.get("broker_order_id")
                      or evidence.get("order_id")
                      or evidence.get("id")
                      or order.get("broker_order_id")
                      or "?"
                  )
                  message = (
                      "EXIT_FILL_TIMESTAMP_MISSING_OR_INVALID | "
                      f"client={self.client_id} local_order_id={local_id} "
                      f"broker_order_id={broker_id} position_id={position_id} "
                      f"contract={contract} broker_status={broker_status or '?'} "
                      f"durable_status={durable_status} filled_qty={filled_qty} "
                      f"fill_price={fill_price} broker_timestamp_fields={timestamp_fields!r} "
                      f"source={source} action=HOLD position_mutated=false "
                      "order_terminalized=false"
                  )
                  log.critical("[%s] %s", self.client_id, message)
                  self._alert(message)
                  summary["orders_alerted"] = int(summary.get("orders_alerted", 0)) + 1
                  summary.setdefault("errors", []).append(
                      "exit_fill_timestamp_missing_or_invalid"
                  )

          ''',
          )

          # Stale acknowledged EXIT producer: extract and require broker time,
          # pass it to OSM, and do not claim correction when OSM says False.
          replace_between(
              "ap_reconciler.py",
              "                fill_qty = self._extract_explicit_cumulative_fill_qty(broker_raw)\n",
              "                if broker_status in BROKER_TERMINAL:\n",
              '''                fill_qty = self._extract_explicit_cumulative_fill_qty(broker_raw)
                  fill_px  = self._extract_avg_fill_price(broker_raw)
                  fill_ts  = _extract_broker_fill_timestamp(broker_raw)

                  if broker_status in BROKER_FILLED and fill_qty and fill_px:
                      family     = self._order_family_from_kind_and_status(row, db_status)
                      new_status = "EXIT_FILLED" if family == "EXIT" else "FILLED"
                      if family == "EXIT" and not fill_ts:
                          self._hold_exit_fill_timestamp_missing(
                              summary,
                              order=row,
                              evidence=broker_raw,
                              broker_status=broker_status,
                              source="stale_acknowledged_exit",
                              filled_qty=fill_qty,
                              fill_price=fill_px,
                              broker_order_id=broker_id,
                          )
                          continue
                      try:
                          ok = self.osm.transition(
                              local_id, new_status,
                              broker_order_id=broker_id,
                              filled_qty=int(fill_qty),
                              fill_price=float(fill_px),
                              filled_ts=fill_ts if family == "EXIT" else None,
                              last_error="stale_ack_exit_broker_filled",
                          )
                          if not ok:
                              summary["orders_alerted"] = int(summary.get("orders_alerted", 0)) + 1
                              summary.setdefault("errors", []).append("stale_ack_exit_osm_transition_held")
                              log.error(
                                  "[%s] STALE_EXIT_FILL_OSM_HELD | %s | local=%s broker=%s",
                                  self.client_id, contract, local_id, broker_id,
                              )
                              continue
                          summary["orders_corrected"] = int(summary.get("orders_corrected", 0)) + 1
                          log.warning(
                              "[%s] STALE_EXIT_RESOLVED FILLED | %s | local=%s broker=%s age=%.1fs",
                              self.client_id, contract, local_id, broker_id, age_sec,
                          )
                      except Exception as exc:
                          log.error("[%s] stale_ack_exit OSM transition failed: %s", self.client_id, exc)
                      continue

          ''',
          )

          # Missing-id recent-fill evidence must carry the exact timestamp and
          # broker order identity instead of minting a timestamp-less terminal row.
          replace_between(
              "ap_reconciler.py",
              "        # Endpoint 2: recent fill evidence. Prefer to advance OSM so OSM owns hooks.\n",
              "        # Endpoint 3: negative proof after recovery passes. No broker order and no recent fill.\n",
              '''        # Endpoint 2: recent fill evidence. Prefer to advance OSM so OSM owns hooks.
              recent_fill = self._get_recent_exit_fill(contract, underlying)
              if recent_fill:
                  fill_qty = self._safe_int(recent_fill.get("filled_qty"), requested_qty or 0)
                  fill_px  = self._safe_float(recent_fill.get("fill_price"), 0.0)
                  fill_ts  = _extract_broker_fill_timestamp(recent_fill)
                  fill_broker_id = str(recent_fill.get("broker_order_id") or "").strip()
                  if fill_qty > 0 and fill_px > 0:
                      if not fill_ts:
                          self._hold_exit_fill_timestamp_missing(
                              summary,
                              order=order,
                              evidence=recent_fill,
                              broker_status="recent_local_fill",
                              source="missing_id_recent_exit_fill",
                              filled_qty=fill_qty,
                              fill_price=fill_px,
                              broker_order_id=fill_broker_id or None,
                          )
                          return False
                      if not fill_broker_id:
                          self._alert(
                              f"MISSING_ID_EXIT_RECENT_FILL_IDENTITY_INCOMPLETE | {contract or '?'} | "
                              f"{local_id} | pos={pos_id}; exact broker_order_id missing; keeping quarantine"
                          )
                          summary["orders_alerted"] += 1
                          summary.setdefault("errors", []).append(
                              "missing_id_recent_exit_fill_broker_order_id_missing"
                          )
                          return False
                      try:
                          ok = self.osm.transition(
                              local_id,
                              "EXIT_FILLED",
                              broker_order_id=fill_broker_id,
                              filled_qty=fill_qty,
                              fill_price=fill_px,
                              filled_ts=fill_ts,
                              last_error="reconciler_missing_id_recent_exit_fill_resolved",
                          )
                          if not ok:
                              self._alert(
                                  f"MISSING_ID_EXIT_RECENT_FILL_OSM_HELD | {contract or '?'} | "
                                  f"{local_id} | pos={pos_id}; durable terminalization not proven"
                              )
                              summary["orders_alerted"] += 1
                              summary.setdefault("errors", []).append(
                                  "missing_id_recent_exit_fill_osm_held"
                              )
                              return False
                          self._alert(
                              f"MISSING_ID_EXIT_RESOLVED_BY_RECENT_FILL | {contract or '?'} | {local_id} | "
                              f"pos={pos_id} qty={fill_qty} price={fill_px:.4f} broker={fill_broker_id}"
                          )
                          summary["orders_corrected"] += 1
                          return True
                      except Exception as exc:
                          self._alert(
                              f"MISSING_ID_EXIT_RECENT_FILL_OSM_FAILED | {contract or '?'} | {local_id} | {exc}"
                          )
                          summary["orders_alerted"] += 1
                          return False
                  self._alert(
                      f"MISSING_ID_EXIT_RECENT_FILL_INCOMPLETE | {contract or '?'} | {local_id} | "
                      "recent fill found but qty/price missing; keeping quarantine"
                  )
                  summary["orders_alerted"] += 1
                  return False

          ''',
          )

          replace_once(
              "ap_reconciler.py",
              "                        SELECT fill_price, filled_qty, updated_ts\n",
              "                        SELECT fill_price, filled_qty, filled_ts, broker_order_id, updated_ts\n",
          )

          # Normal broker-fill reconciler producer: require exact timestamp only
          # for EXIT family and propagate it through both bridge paths.
          replace_once(
              "ap_reconciler.py",
              '''        if avg_fill is None:
              self._alert(
                  f"BROKER_FILL_PRICE_NOT_NORMALIZED | {contract} | {local_id} | "
                  "broker returned filled/partial status without explicit avg fill price; "
                  "skipping OSM correction until broker adapter normalizes this field"
              )
              summary["orders_alerted"] += 1
              return

          requested_qty    = self._db_order_requested_qty(order)
          ''',
              '''        if avg_fill is None:
              self._alert(
                  f"BROKER_FILL_PRICE_NOT_NORMALIZED | {contract} | {local_id} | "
                  "broker returned filled/partial status without explicit avg fill price; "
                  "skipping OSM correction until broker adapter normalizes this field"
              )
              summary["orders_alerted"] += 1
              return

          broker_order_id = (
              self._broker_order_id_from_raw(broker_raw)
              or str(order.get("broker_order_id") or "").strip()
              or None
          )
          broker_filled_ts = (
              _extract_broker_fill_timestamp(broker_raw) if family == "EXIT" else None
          )
          if family == "EXIT" and not broker_filled_ts:
              self._hold_exit_fill_timestamp_missing(
                  summary,
                  order=order,
                  evidence=broker_raw,
                  broker_status=broker_status,
                  source="advance_order_to_broker_fill",
                  filled_qty=filled_qty,
                  fill_price=avg_fill,
                  broker_order_id=broker_order_id,
              )
              return

          requested_qty    = self._db_order_requested_qty(order)
          ''',
          )

          replace_once(
              "ap_reconciler.py",
              "                self._apply_osm_fill_update(local_id, partial_status, db_filled_before, avg_fill)\n",
              '''                self._apply_osm_fill_update(
                  local_id,
                  partial_status,
                  db_filled_before,
                  avg_fill,
                  broker_order_id=broker_order_id,
                  filled_ts=(order.get("filled_ts") or broker_filled_ts) if family == "EXIT" else None,
              )
          ''',
          )

          replace_once(
              "ap_reconciler.py",
              '''                broker_order_id=str(
                  broker_raw.get("id")
                  or broker_raw.get("order_id")
                  or broker_raw.get("broker_order_id")
                  or ""
              ) or None,
          ''',
              '''                broker_order_id=broker_order_id,
              filled_ts=broker_filled_ts,
          ''',
          )

          # -----------------------------------------------------------------
          # OSM: reject timestamp-less positive EXIT fills BEFORE DB mutation.
          # -----------------------------------------------------------------
          replace_once(
              "ap/order_state_machine.py",
              "\n# P0 client-parity (2026-06-04): canonical_signal_id groups the same\n",
              '''\ndef _normalize_broker_filled_ts(value) -> str | None:
              """Normalize an exact timezone-aware broker execution timestamp."""
              if value is None or str(value).strip() == "":
                  return None
              if isinstance(value, datetime):
                  parsed = value
              else:
                  try:
                      parsed = datetime.fromisoformat(str(value).strip().replace("Z", "+00:00"))
                  except (TypeError, ValueError):
                      return None
              try:
                  if parsed.tzinfo is None or parsed.utcoffset() is None:
                      return None
                  return parsed.astimezone(timezone.utc).isoformat()
              except Exception:
                  return None


          # P0 client-parity (2026-06-04): canonical_signal_id groups the same
          ''',
          )

          replace_once(
              "ap/order_state_machine.py",
              '''        prev_filled = self._safe_int(current.get("filled_qty"), 0)
              same_state_fill_update = False
          ''',
              '''        prev_filled = self._safe_int(current.get("filled_qty"), 0)
              incoming_filled = None
              same_state_fill_update = False
          ''',
          )

          replace_once(
              "ap/order_state_machine.py",
              '''        if old_status == new_status:
          ''',
              '''        effective_filled = incoming_filled if incoming_filled is not None else prev_filled
              if (
                  kind.upper() == "EXIT"
                  and new_status in (OrderStatus.EXIT_PARTIAL_FILL, OrderStatus.EXIT_FILLED)
                  and effective_filled > 0
              ):
                  normalized_filled_ts = _normalize_broker_filled_ts(filled_ts)
                  if normalized_filled_ts is None:
                      reason = "EXIT_FILL_TIMESTAMP_MISSING_OR_INVALID"
                      log.critical(
                          "[%s] %s | order=%s broker=%s position=%s contract=%s "
                          "status=%s->%s filled_qty=%s fill_price=%s action=HOLD "
                          "position_mutated=false order_terminalized=false",
                          self.client_id,
                          reason,
                          local_order_id,
                          broker_order_id or current.get("broker_order_id") or "?",
                          position_id or current.get("position_id") or "?",
                          current.get("contract") or current.get("symbol") or "?",
                          old_status,
                          new_status,
                          effective_filled,
                          fill_price,
                      )
                      self._emit_transition_event(
                          local_order_id=local_order_id,
                          old_status=old_status,
                          new_status=new_status,
                          order=current,
                          decision="HOLD",
                          reason_code=reason,
                          explanation=(
                              "Refusing positive EXIT fill before durable mutation: "
                              "an exact timezone-aware broker execution timestamp is required."
                          ),
                          broker_order_id=broker_order_id,
                          filled_qty=effective_filled,
                          fill_price=fill_price,
                          last_error=last_error,
                          extra_inputs={
                              "position_id": position_id or current.get("position_id"),
                              "action": "HOLD",
                              "position_mutated": False,
                              "order_terminalized": False,
                          },
                      )
                      return False
                  filled_ts = normalized_filled_ts

              if old_status == new_status:
          ''',
          )

          # -----------------------------------------------------------------
          # Focused regression tests. Behavior first, not source introspection.
          # -----------------------------------------------------------------
          Path("tests/test_p0_reconciler_exit_fill_timestamp_contract.py").write_text(r'''import os
          os.environ.setdefault("DATABASE_URL", "postgresql://test:test@127.0.0.1:5432/test")

          from datetime import datetime

          import pytest

          import ap.db as db_mod
          import ap.order_state_machine as osm_mod
          from ap.order_state_machine import APOrderStateMachine, OrderStatus
          from ap_reconciler import APBrokerReconciler, _extract_broker_fill_timestamp


          FILL_TS = "2026-09-10T14:35:28+00:00"


          class FakeOSM:
              def __init__(self):
                  self.calls = []

              def transition(self, local_order_id, status, **kwargs):
                  self.calls.append((local_order_id, status, kwargs))
                  return True


          def _reconciler(osm=None):
              rec = APBrokerReconciler.__new__(APBrokerReconciler)
              rec.client_id = "jason-test@example.com"
              rec.osm = osm or FakeOSM()
              rec.pm = None
              rec.exit_engine = None
              rec._missing_id_exit_tracker = {}
              rec.alerts = []
              rec._alert = rec.alerts.append
              return rec


          def _exit_order(**overrides):
              row = {
                  "local_order_id": "exit-local-1",
                  "broker_order_id": "145345180",
                  "position_id": "position-1",
                  "kind": "EXIT",
                  "status": "EXIT_ACKNOWLEDGED",
                  "contract": "HOOD260911P00113000",
                  "symbol": "HOOD",
                  "qty": 1,
                  "filled_qty": 0,
              }
              row.update(overrides)
              return row


          def _broker_fill(**overrides):
              raw = {
                  "id": "145345180",
                  "status": "filled",
                  "filled_qty": 1,
                  "avg_fill_price": 1.19,
                  "last_fill_date": FILL_TS,
              }
              raw.update(overrides)
              return raw


          def _summary():
              return {"orders_corrected": 0, "orders_alerted": 0, "errors": [], "positions_imported": 0}


          def test_exact_broker_timestamp_parser_accepts_tradier_last_fill_date():
              parsed = _extract_broker_fill_timestamp(_broker_fill())
              assert parsed is not None
              dt = datetime.fromisoformat(parsed)
              assert dt.tzinfo is not None and dt.utcoffset() is not None


          def test_normal_reconciler_exit_fill_propagates_timestamp_and_broker_identity():
              osm = FakeOSM()
              rec = _reconciler(osm)
              summary = _summary()
              rec._advance_order_to_broker_fill(_exit_order(), _broker_fill(), "filled", summary)
              assert len(osm.calls) == 1
              _, status, kwargs = osm.calls[0]
              assert status == "EXIT_FILLED"
              assert kwargs["filled_qty"] == 1
              assert kwargs["fill_price"] == 1.19
              assert kwargs["broker_order_id"] == "145345180"
              assert datetime.fromisoformat(kwargs["filled_ts"]).utcoffset() is not None
              assert summary["orders_corrected"] == 1


          def test_normal_reconciler_exit_fill_missing_timestamp_holds_without_osm_mutation():
              osm = FakeOSM()
              rec = _reconciler(osm)
              summary = _summary()
              raw = _broker_fill()
              raw.pop("last_fill_date")
              rec._advance_order_to_broker_fill(_exit_order(), raw, "filled", summary)
              assert osm.calls == []
              assert summary["orders_corrected"] == 0
              assert summary["orders_alerted"] == 1
              assert "exit_fill_timestamp_missing_or_invalid" in summary["errors"]
              report = rec.alerts[-1]
              assert "EXIT_FILL_TIMESTAMP_MISSING_OR_INVALID" in report
              assert "broker_order_id=145345180" in report
              assert "position_id=position-1" in report
              assert "contract=HOOD260911P00113000" in report
              assert "action=HOLD" in report
              assert "position_mutated=false" in report
              assert "order_terminalized=false" in report


          def test_stale_ack_exit_passes_exact_timestamp_and_only_counts_true_transition(monkeypatch):
              osm = FakeOSM()
              rec = _reconciler(osm)
              rec.broker = type("Broker", (), {"get_order": lambda self, oid: _broker_fill()})()
              summary = _summary()

              class FakeConn:
                  def __enter__(self): return self
                  def __exit__(self, *args): return False
                  def execute(self, *args, **kwargs): return self
                  def fetchall(self):
                      return [dict(_exit_order(), age_sec=25.0, submitted_ts=FILL_TS)]

              monkeypatch.setattr(db_mod, "conn", lambda: FakeConn())
              monkeypatch.setattr(db_mod, "run_with_retry", lambda fn: fn())
              rec._handle_stale_acknowledged_exits(summary)
              assert len(osm.calls) == 1
              _, status, kwargs = osm.calls[0]
              assert status == "EXIT_FILLED"
              assert kwargs["filled_ts"] is not None
              assert summary["orders_corrected"] == 1


          def test_missing_id_recent_fill_requires_timestamp_before_terminalizing():
              osm = FakeOSM()
              rec = _reconciler(osm)
              rec._recover_missing_broker_id_exit = lambda order, summary: False
              rec._get_recent_exit_fill = lambda contract, underlying: {
                  "filled_qty": 1,
                  "fill_price": 1.19,
                  "broker_order_id": "145345180",
              }
              summary = _summary()
              result = rec._resolve_missing_id_exit_truth(
                  _exit_order(broker_order_id=""), summary, reason="test"
              )
              assert result is False
              assert osm.calls == []
              assert "exit_fill_timestamp_missing_or_invalid" in summary["errors"]


          def test_missing_id_recent_fill_propagates_timestamp_and_identity():
              osm = FakeOSM()
              rec = _reconciler(osm)
              rec._recover_missing_broker_id_exit = lambda order, summary: False
              rec._get_recent_exit_fill = lambda contract, underlying: {
                  "filled_qty": 1,
                  "fill_price": 1.19,
                  "filled_ts": FILL_TS,
                  "broker_order_id": "145345180",
              }
              summary = _summary()
              result = rec._resolve_missing_id_exit_truth(
                  _exit_order(broker_order_id=""), summary, reason="test"
              )
              assert result is True
              assert len(osm.calls) == 1
              _, status, kwargs = osm.calls[0]
              assert status == "EXIT_FILLED"
              assert kwargs["broker_order_id"] == "145345180"
              assert kwargs["filled_ts"] is not None


          def test_osm_rejects_positive_exit_fill_without_timestamp_before_db_write(monkeypatch):
              osm = APOrderStateMachine.__new__(APOrderStateMachine)
              osm.client_id = "jason-test@example.com"
              osm._get_order = lambda local_id: _exit_order()
              events = []
              osm._emit_transition_event = lambda **kwargs: events.append(kwargs)
              osm._record_error = lambda *args, **kwargs: None
              monkeypatch.setattr(
                  osm_mod,
                  "run_with_retry",
                  lambda fn: pytest.fail("DB mutation attempted before timestamp guard"),
              )
              ok = osm.transition(
                  "exit-local-1",
                  OrderStatus.EXIT_FILLED,
                  broker_order_id="145345180",
                  filled_qty=1,
                  fill_price=1.19,
                  filled_ts=None,
              )
              assert ok is False
              assert events[-1]["decision"] == "HOLD"
              assert events[-1]["reason_code"] == "EXIT_FILL_TIMESTAMP_MISSING_OR_INVALID"
              assert events[-1]["extra_inputs"]["position_mutated"] is False
              assert events[-1]["extra_inputs"]["order_terminalized"] is False
          ''')
          PY

