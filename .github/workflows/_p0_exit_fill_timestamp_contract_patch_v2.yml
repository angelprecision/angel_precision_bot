name: One-shot P0 EXIT fill timestamp contract patch v2

on:
  push:
    branches:
      - fix/p0-exit-fill-timestamp-contract-20260910
    paths:
      - .github/workflows/_p0_exit_fill_timestamp_contract_patch_v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-exit-fill-timestamp-contract-20260910
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply audited patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p = Path(path); text = p.read_text(); n = text.count(old)
              assert n == 1, f"{path}: expected one target, found {n}: {old[:100]!r}"
              p.write_text(text.replace(old, new, 1))

          def between(path, start, end, new):
              p = Path(path); text = p.read_text()
              assert text.count(start) == 1, f"{path}: start count != 1: {start!r}"
              i = text.index(start); j = text.index(end, i)
              p.write_text(text[:i] + new + text[j:])

          # Reconciler: exact broker fill timestamp authority, no new top-level import cycle.
          once("ap_reconciler.py", "\n\n_HISTORICAL_UNDERLYING_KEYS = (", r'''

          _BROKER_FILL_TIMESTAMP_KEYS = (
              "last_fill_date", "filled_at", "filled_ts", "fill_ts", "transaction_date",
          )

          def _extract_broker_fill_timestamp(raw: dict) -> Optional[str]:
              """Return only an explicit timezone-aware broker execution timestamp."""
              try:
                  from ap.manual_close_reconciliation import order_filled_at
                  filled_at = order_filled_at(raw)
              except Exception:
                  return None
              if not isinstance(filled_at, datetime):
                  return None
              try:
                  if filled_at.tzinfo is None or filled_at.utcoffset() is None:
                      return None
                  return filled_at.astimezone(timezone.utc).isoformat()
              except Exception:
                  return None


          _HISTORICAL_UNDERLYING_KEYS = (''')

          between(
              "ap_reconciler.py",
              "    def _apply_osm_fill_update(\n",
              "    def _handle_stale_acknowledged_exits(",
              r'''    def _apply_osm_fill_update(
                  self,
                  local_id: str,
                  status: str,
                  filled_qty: int,
                  fill_price: float,
                  broker_order_id: str | None = None,
                  filled_ts: str | None = None,
              ) -> bool:
                  """Compatibility bridge for OSM v3 apply_fill_update()."""
                  status_u = str(status or "").upper()
                  apply_fn = getattr(self.osm, "apply_fill_update", None)
                  if callable(apply_fn) and status_u in {"PARTIAL_FILL", "EXIT_PARTIAL_FILL"}:
                      try:
                          return bool(apply_fn(
                              local_id,
                              cumulative_filled=int(filled_qty),
                              fill_price=float(fill_price) if fill_price is not None else None,
                              broker_order_id=broker_order_id,
                              filled_ts=filled_ts,
                          ))
                      except TypeError as te:
                          log.warning(
                              "[%s] OSM apply_fill_update signature mismatch for %s; falling back to transition(): %s",
                              self.client_id, local_id, te,
                          )
                  return bool(self.osm.transition(
                      local_id,
                      status_u,
                      filled_qty=int(filled_qty),
                      fill_price=float(fill_price) if fill_price is not None else None,
                      broker_order_id=broker_order_id,
                      filled_ts=filled_ts,
                  ))

              def _hold_exit_fill_timestamp_missing(
                  self,
                  summary: dict,
                  *,
                  order: dict,
                  evidence: dict,
                  broker_status: str,
                  source: str,
                  filled_qty,
                  fill_price,
                  broker_order_id: str | None = None,
              ) -> None:
                  timestamp_fields = {
                      key: evidence.get(key)
                      for key in _BROKER_FILL_TIMESTAMP_KEYS
                      if key in evidence
                  }
                  local_id = order.get("local_order_id") or order.get("id") or "?"
                  position_id = order.get("position_id") or order.get("positionId") or "?"
                  contract = order.get("contract") or order.get("symbol") or "?"
                  durable_status = order.get("status") or "?"
                  broker_id = (
                      broker_order_id
                      or evidence.get("broker_order_id")
                      or evidence.get("order_id")
                      or evidence.get("id")
                      or order.get("broker_order_id")
                      or "?"
                  )
                  message = (
                      "EXIT_FILL_TIMESTAMP_MISSING_OR_INVALID | "
                      f"client_id={self.client_id} local_order_id={local_id} "
                      f"broker_order_id={broker_id} position_id={position_id} "
                      f"contract={contract} broker_status={broker_status or '?'} "
                      f"durable_status={durable_status} filled_qty={filled_qty} "
                      f"fill_price={fill_price} broker_timestamp_fields={timestamp_fields!r} "
                      f"source={source} action=HOLD position_mutated=false "
                      "order_terminalized=false"
                  )
                  log.critical("[%s] %s", self.client_id, message)
                  self._alert(message)
                  summary["orders_alerted"] = int(summary.get("orders_alerted", 0)) + 1
                  summary.setdefault("errors", []).append("exit_fill_timestamp_missing_or_invalid")

          ''')

          # Stale ACK path: pass timestamp and stop reporting a failed OSM transition as corrected.
          between(
              "ap_reconciler.py",
              "                fill_qty = self._extract_explicit_cumulative_fill_qty(broker_raw)\n",
              "                if broker_status in BROKER_TERMINAL:\n",
              r'''                fill_qty = self._extract_explicit_cumulative_fill_qty(broker_raw)
                  fill_px  = self._extract_avg_fill_price(broker_raw)
                  fill_ts  = _extract_broker_fill_timestamp(broker_raw)

                  if broker_status in BROKER_FILLED and fill_qty and fill_px:
                      family     = self._order_family_from_kind_and_status(row, db_status)
                      new_status = "EXIT_FILLED" if family == "EXIT" else "FILLED"
                      if family == "EXIT" and not fill_ts:
                          self._hold_exit_fill_timestamp_missing(
                              summary,
                              order=row,
                              evidence=broker_raw,
                              broker_status=broker_status,
                              source="stale_acknowledged_exit",
                              filled_qty=fill_qty,
                              fill_price=fill_px,
                              broker_order_id=broker_id,
                          )
                          continue
                      try:
                          ok = self.osm.transition(
                              local_id, new_status,
                              broker_order_id=broker_id,
                              filled_qty=int(fill_qty),
                              fill_price=float(fill_px),
                              filled_ts=fill_ts if family == "EXIT" else None,
                              last_error="stale_ack_exit_broker_filled",
                          )
                          if not ok:
                              summary["orders_alerted"] = int(summary.get("orders_alerted", 0)) + 1
                              summary.setdefault("errors", []).append("stale_ack_exit_osm_transition_held")
                              log.error(
                                  "[%s] STALE_EXIT_FILL_OSM_HELD | %s | local=%s broker=%s",
                                  self.client_id, contract, local_id, broker_id,
                              )
                              continue
                          summary["orders_corrected"] = int(summary.get("orders_corrected", 0)) + 1
                          log.warning(
                              "[%s] STALE_EXIT_RESOLVED FILLED | %s | local=%s broker=%s age=%.1fs",
                              self.client_id, contract, local_id, broker_id, age_sec,
                          )
                      except Exception as exc:
                          log.error("[%s] stale_ack_exit OSM transition failed: %s", self.client_id, exc)
                      continue

          ''')

          # Missing-ID local fill evidence must include exact timestamp + broker identity.
          between(
              "ap_reconciler.py",
              "        # Endpoint 2: recent fill evidence. Prefer to advance OSM so OSM owns hooks.\n",
              "        # Endpoint 3: negative proof after recovery passes. No broker order and no recent fill.\n",
              r'''        # Endpoint 2: recent fill evidence. Prefer to advance OSM so OSM owns hooks.
              recent_fill = self._get_recent_exit_fill(contract, underlying)
              if recent_fill:
                  fill_qty = self._safe_int(recent_fill.get("filled_qty"), requested_qty or 0)
                  fill_px  = self._safe_float(recent_fill.get("fill_price"), 0.0)
                  fill_ts  = _extract_broker_fill_timestamp(recent_fill)
                  fill_broker_id = str(recent_fill.get("broker_order_id") or "").strip()
                  if fill_qty > 0 and fill_px > 0:
                      if not fill_ts:
                          self._hold_exit_fill_timestamp_missing(
                              summary,
                              order=order,
                              evidence=recent_fill,
                              broker_status="recent_local_fill",
                              source="missing_id_recent_exit_fill",
                              filled_qty=fill_qty,
                              fill_price=fill_px,
                              broker_order_id=fill_broker_id or None,
                          )
                          return False
                      if not fill_broker_id:
                          self._alert(
                              f"MISSING_ID_EXIT_RECENT_FILL_IDENTITY_INCOMPLETE | {contract or '?'} | "
                              f"{local_id} | pos={pos_id}; exact broker_order_id missing; keeping quarantine"
                          )
                          summary["orders_alerted"] += 1
                          summary.setdefault("errors", []).append(
                              "missing_id_recent_exit_fill_broker_order_id_missing"
                          )
                          return False
                      try:
                          ok = self.osm.transition(
                              local_id,
                              "EXIT_FILLED",
                              broker_order_id=fill_broker_id,
                              filled_qty=fill_qty,
                              fill_price=fill_px,
                              filled_ts=fill_ts,
                              last_error="reconciler_missing_id_recent_exit_fill_resolved",
                          )
                          if not ok:
                              self._alert(
                                  f"MISSING_ID_EXIT_RECENT_FILL_OSM_HELD | {contract or '?'} | "
                                  f"{local_id} | pos={pos_id}; durable terminalization not proven"
                              )
                              summary["orders_alerted"] += 1
                              summary.setdefault("errors", []).append("missing_id_recent_exit_fill_osm_held")
                              return False
                          self._alert(
                              f"MISSING_ID_EXIT_RESOLVED_BY_RECENT_FILL | {contract or '?'} | {local_id} | "
                              f"pos={pos_id} qty={fill_qty} price={fill_px:.4f} broker={fill_broker_id}"
                          )
                          summary["orders_corrected"] += 1
                          return True
                      except Exception as exc:
                          self._alert(
                              f"MISSING_ID_EXIT_RECENT_FILL_OSM_FAILED | {contract or '?'} | {local_id} | {exc}"
                          )
                          summary["orders_alerted"] += 1
                          return False
                  self._alert(
                      f"MISSING_ID_EXIT_RECENT_FILL_INCOMPLETE | {contract or '?'} | {local_id} | "
                      "recent fill found but qty/price missing; keeping quarantine"
                  )
                  summary["orders_alerted"] += 1
                  return False

          ''')

          once(
              "ap_reconciler.py",
              "                        SELECT fill_price, filled_qty, updated_ts\n",
              "                        SELECT fill_price, filled_qty, filled_ts, broker_order_id, updated_ts\n",
          )

          # Replace this function as one audited unit to avoid whitespace-sensitive micro replacements.
          between(
              "ap_reconciler.py",
              "    def _advance_order_to_broker_fill(\n",
              "    def _advance_order_to_terminal(\n",
              r'''    def _advance_order_to_broker_fill(
                  self,
                  order: dict,
                  broker_raw: dict,
                  broker_status: str,
                  summary: dict,
              ) -> None:
                  local_id  = order.get("local_order_id") or order.get("id")
                  contract  = order.get("contract") or order.get("symbol") or "?"
                  db_status = (order.get("status") or "").upper()
                  family    = self._order_family_from_kind_and_status(order, db_status)
                  if family not in {"ENTRY", "EXIT"}:
                      self._alert(
                          f"RECONCILE_ORDER_FAMILY_AMBIGUOUS | {contract} | {local_id} | "
                          f"kind={order.get('kind')} status={db_status} broker={broker_status}; "
                          "skipping fill correction to avoid wrong ENTRY/EXIT state-family transition"
                      )
                      summary["orders_alerted"] += 1
                      return

                  new_status = "FILLED" if family == "ENTRY" else "EXIT_FILLED"
                  if broker_status == "partially_filled":
                      new_status = "PARTIAL_FILL" if family == "ENTRY" else "EXIT_PARTIAL_FILL"

                  filled_qty = self._extract_explicit_cumulative_fill_qty(broker_raw)
                  avg_fill   = self._extract_avg_fill_price(broker_raw)
                  if filled_qty is None:
                      self._alert(
                          f"BROKER_FILL_QTY_NOT_NORMALIZED | {contract} | {local_id} | "
                          "broker returned filled/partial status without explicit cumulative fill qty; "
                          "skipping OSM correction until broker adapter normalizes this field"
                      )
                      summary["orders_alerted"] += 1
                      return
                  if avg_fill is None:
                      self._alert(
                          f"BROKER_FILL_PRICE_NOT_NORMALIZED | {contract} | {local_id} | "
                          "broker returned filled/partial status without explicit avg fill price; "
                          "skipping OSM correction until broker adapter normalizes this field"
                      )
                      summary["orders_alerted"] += 1
                      return

                  broker_order_id = (
                      self._broker_order_id_from_raw(broker_raw)
                      or str(order.get("broker_order_id") or "").strip()
                      or None
                  )
                  broker_filled_ts = (
                      _extract_broker_fill_timestamp(broker_raw) if family == "EXIT" else None
                  )
                  if family == "EXIT" and not broker_filled_ts:
                      self._hold_exit_fill_timestamp_missing(
                          summary,
                          order=order,
                          evidence=broker_raw,
                          broker_status=broker_status,
                          source="advance_order_to_broker_fill",
                          filled_qty=filled_qty,
                          fill_price=avg_fill,
                          broker_order_id=broker_order_id,
                      )
                      return

                  requested_qty    = self._db_order_requested_qty(order)
                  db_filled_before = self._db_order_filled_qty(order)
                  if (
                      requested_qty > 0
                      and db_filled_before > 0
                      and db_filled_before < requested_qty
                      and filled_qty >= requested_qty
                  ):
                      partial_status = "PARTIAL_FILL" if family == "ENTRY" else "EXIT_PARTIAL_FILL"
                      try:
                          self._apply_osm_fill_update(
                              local_id,
                              partial_status,
                              db_filled_before,
                              avg_fill,
                              broker_order_id=broker_order_id,
                              filled_ts=(order.get("filled_ts") or broker_filled_ts) if family == "EXIT" else None,
                          )
                          log.warning(
                              "[%s] RECONCILE_INTERMEDIATE_FILL_UPDATE | %s | %s | qty=%s before terminal qty=%s",
                              self.client_id, contract, local_id, db_filled_before, filled_qty,
                          )
                      except Exception as ie:
                          log.error("[%s] Intermediate fill update failed for %s: %s",
                                    self.client_id, local_id, ie)

                  log.warning(
                      "[%s] RECONCILE_CORRECT: %s | %s | DB=%s broker=%s → advancing to %s",
                      self.client_id, contract, local_id, db_status, broker_status, new_status,
                  )

                  try:
                      ok = self._apply_osm_fill_update(
                          local_id,
                          new_status,
                          filled_qty=filled_qty,
                          fill_price=avg_fill,
                          broker_order_id=broker_order_id,
                          filled_ts=broker_filled_ts,
                      )
                      if not ok:
                          log.error("[%s] OSM transition failed for %s → %s",
                                    self.client_id, local_id, new_status)
                          return

                      summary["orders_corrected"] += 1
                      self._alert(
                          f"RECONCILE_AUTO_CORRECT | {contract} | {local_id} | "
                          f"DB was {db_status}, broker={broker_status} → advanced to {new_status} "
                          f"(qty={filled_qty} avg={avg_fill:.2f})"
                      )

                      if family == "ENTRY" and new_status == "FILLED" and self.pm:
                          _rec_pos_id = self._ensure_position_for_filled_entry(
                              order, filled_qty, avg_fill, summary
                          )
                          if _rec_pos_id:
                              try:
                                  self._link_order_to_position(
                                      str(order.get("local_order_id") or ""), _rec_pos_id
                                  )
                              except Exception as _le:
                                  log.error(
                                      "[%s] order_position_link_failed reconciler order=%s pos=%s err=%s",
                                      self.client_id,
                                      order.get("local_order_id"), _rec_pos_id, _le,
                                  )
                  except Exception as e:
                      log.error("[%s] Reconcile transition error: %s", self.client_id, e)

          ''')

          # OSM: make the exact EXIT timestamp contract impossible to violate before UPDATE.
          once("ap/order_state_machine.py", "\n# P0 client-parity (2026-06-04): canonical_signal_id groups the same\n", r'''
          def _normalize_broker_filled_ts(value) -> str | None:
              """Normalize an exact timezone-aware broker execution timestamp."""
              if value is None or str(value).strip() == "":
                  return None
              if isinstance(value, datetime):
                  parsed = value
              else:
                  try:
                      parsed = datetime.fromisoformat(str(value).strip().replace("Z", "+00:00"))
                  except (TypeError, ValueError):
                      return None
              try:
                  if parsed.tzinfo is None or parsed.utcoffset() is None:
                      return None
                  return parsed.astimezone(timezone.utc).isoformat()
              except Exception:
                  return None


          # P0 client-parity (2026-06-04): canonical_signal_id groups the same
          ''')

          once(
              "ap/order_state_machine.py",
              '        prev_filled = self._safe_int(current.get("filled_qty"), 0)\n        same_state_fill_update = False\n',
              '        prev_filled = self._safe_int(current.get("filled_qty"), 0)\n        incoming_filled = None\n        same_state_fill_update = False\n',
          )

          once("ap/order_state_machine.py", "\n        if old_status == new_status:\n", r'''
              effective_filled = incoming_filled if incoming_filled is not None else prev_filled
              if (
                  kind.upper() == "EXIT"
                  and new_status in (OrderStatus.EXIT_PARTIAL_FILL, OrderStatus.EXIT_FILLED)
                  and effective_filled > 0
              ):
                  normalized_filled_ts = _normalize_broker_filled_ts(filled_ts)
                  if normalized_filled_ts is None:
                      reason = "EXIT_FILL_TIMESTAMP_MISSING_OR_INVALID"
                      log.critical(
                          "[%s] %s | order=%s broker=%s position=%s contract=%s "
                          "status=%s->%s filled_qty=%s fill_price=%s action=HOLD "
                          "position_mutated=false order_terminalized=false",
                          self.client_id, reason, local_order_id,
                          broker_order_id or current.get("broker_order_id") or "?",
                          position_id or current.get("position_id") or "?",
                          current.get("contract") or current.get("symbol") or "?",
                          old_status, new_status, effective_filled, fill_price,
                      )
                      self._emit_transition_event(
                          local_order_id=local_order_id,
                          old_status=old_status,
                          new_status=new_status,
                          order=current,
                          decision="HOLD",
                          reason_code=reason,
                          explanation=(
                              "Refusing positive EXIT fill before durable mutation: "
                              "an exact timezone-aware broker execution timestamp is required."
                          ),
                          broker_order_id=broker_order_id,
                          filled_qty=effective_filled,
                          fill_price=fill_price,
                          last_error=last_error,
                          extra_inputs={
                              "position_id": position_id or current.get("position_id"),
                              "action": "HOLD",
                              "position_mutated": False,
                              "order_terminalized": False,
                          },
                      )
                      return False
                  filled_ts = normalized_filled_ts

              if old_status == new_status:
          ''')

          Path("tests/test_p0_reconciler_exit_fill_timestamp_contract.py").write_text(r'''import os
          os.environ.setdefault("DATABASE_URL", "postgresql://test:test@127.0.0.1:5432/test")

          from datetime import datetime
          import pytest
          import ap.order_state_machine as osm_mod
          from ap.order_state_machine import APOrderStateMachine, OrderStatus
          from ap_reconciler import APBrokerReconciler, _extract_broker_fill_timestamp

          FILL_TS = "2026-09-10T14:35:28+00:00"

          class FakeOSM:
              def __init__(self, result=True): self.calls = []; self.result = result
              def transition(self, local_order_id, status, **kwargs):
                  self.calls.append((local_order_id, status, kwargs)); return self.result

          def rec(osm=None):
              r = APBrokerReconciler.__new__(APBrokerReconciler)
              r.client_id = "jason-test@example.com"; r.osm = osm or FakeOSM(); r.pm = None
              r.exit_engine = None; r._missing_id_exit_tracker = {}; r.alerts = []; r._alert = r.alerts.append
              return r

          def order(**kw):
              x = {"local_order_id":"exit-local-1","broker_order_id":"145345180",
                   "position_id":"position-1","kind":"EXIT","status":"EXIT_ACKNOWLEDGED",
                   "contract":"HOOD260911P00113000","symbol":"HOOD","qty":1,"filled_qty":0}
              x.update(kw); return x

          def fill(**kw):
              x = {"id":"145345180","status":"filled","filled_qty":1,
                   "avg_fill_price":1.19,"last_fill_date":FILL_TS}
              x.update(kw); return x

          def summary(): return {"orders_corrected":0,"orders_alerted":0,"errors":[],"positions_imported":0}

          def test_parser_accepts_exact_tradier_fill_timestamp():
              ts = _extract_broker_fill_timestamp(fill())
              assert ts and datetime.fromisoformat(ts).utcoffset() is not None

          def test_normal_exit_fill_propagates_timestamp_and_identity():
              o = FakeOSM(); r = rec(o); s = summary()
              r._advance_order_to_broker_fill(order(), fill(), "filled", s)
              assert len(o.calls) == 1
              _, status, k = o.calls[0]
              assert status == "EXIT_FILLED" and k["filled_qty"] == 1 and k["fill_price"] == 1.19
              assert k["broker_order_id"] == "145345180"
              assert datetime.fromisoformat(k["filled_ts"]).utcoffset() is not None
              assert s["orders_corrected"] == 1

          def test_normal_exit_fill_without_timestamp_holds_before_osm():
              o = FakeOSM(); r = rec(o); s = summary(); raw = fill(); raw.pop("last_fill_date")
              r._advance_order_to_broker_fill(order(), raw, "filled", s)
              assert o.calls == [] and s["orders_corrected"] == 0 and s["orders_alerted"] == 1
              report = r.alerts[-1]
              for token in ("EXIT_FILL_TIMESTAMP_MISSING_OR_INVALID","client_id=jason-test@example.com",
                            "broker_order_id=145345180","position_id=position-1","contract=HOOD260911P00113000",
                            "action=HOLD","position_mutated=false","order_terminalized=false"):
                  assert token in report

          def test_missing_id_recent_fill_without_timestamp_never_terminalizes():
              o = FakeOSM(); r = rec(o); s = summary()
              r._get_recent_exit_fill = lambda c, u: {"filled_qty":1,"fill_price":1.19,"broker_order_id":"145345180"}
              assert r._resolve_missing_id_exit_truth(order(broker_order_id=""), s, reason="test") is False
              assert o.calls == []

          def test_missing_id_recent_fill_passes_timestamp_and_broker_id():
              o = FakeOSM(); r = rec(o); s = summary()
              r._get_recent_exit_fill = lambda c, u: {"filled_qty":1,"fill_price":1.19,"filled_ts":FILL_TS,"broker_order_id":"145345180"}
              assert r._resolve_missing_id_exit_truth(order(broker_order_id=""), s, reason="test") is True
              _, status, k = o.calls[0]
              assert status == "EXIT_FILLED" and k["broker_order_id"] == "145345180" and k["filled_ts"]

          def test_osm_missing_timestamp_rejected_before_db_write(monkeypatch):
              o = APOrderStateMachine.__new__(APOrderStateMachine); o.client_id = "jason-test@example.com"
