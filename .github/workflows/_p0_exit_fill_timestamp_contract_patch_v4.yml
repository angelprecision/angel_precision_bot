name: One-shot P0 EXIT fill timestamp contract patch v4

on:
  push:
    branches:
      - fix/p0-exit-fill-timestamp-contract-20260910
    paths:
      - .github/workflows/_p0_exit_fill_timestamp_contract_patch_v4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-exit-fill-timestamp-contract-20260910
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply corrected audited patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/_p0_exit_fill_timestamp_contract_patch_v3.yml').read_text()
          begin = workflow.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = workflow.index("\n          PY\n", begin)
          script = textwrap.dedent(workflow[begin:end])
          script = script.replace(
              'mutate_segment("ap_reconciler.py", "    def _handle_stale_acknowledged_exits(\\n", "    def _reconcile_orders(\\n", patch_stale)',
              'mutate_segment("ap_reconciler.py", "    def _handle_stale_acknowledged_exits(", "    def _reconcile_orders(\\n", patch_stale)',
          )
          assert '"    def _handle_stale_acknowledged_exits(\\n"' not in script
          Path('/tmp/apply_exit_fill_patch.py').write_text(script)
          PY
          python /tmp/apply_exit_fill_patch.py

          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_p0_reconciler_exit_fill_timestamp_contract.py')
          text = p.read_text()
          old = '''    o = FakeOSM(); r = rec(o); s = summary()\n    r._get_recent_exit_fill = lambda c, u:'''
          new = '''    o = FakeOSM(); r = rec(o); s = summary()\n    r._recover_missing_broker_id_exit = lambda order, summary: False\n    r._get_recent_exit_fill = lambda c, u:'''
          count = text.count(old)
          assert count == 2, f'expected two missing-id test anchors, found {count}'
          p.write_text(text.replace(old, new))
          PY

      - name: Compile touched files
        run: python -m py_compile ap_reconciler.py ap/order_state_machine.py tests/test_p0_reconciler_exit_fill_timestamp_contract.py

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests psycopg2-binary python-dotenv cryptography numpy pandas

      - name: Run focused regression tests
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
        run: pytest -q tests/test_p0_reconciler_exit_fill_timestamp_contract.py

      - name: Commit only audited patch
        shell: bash
        run: |
          git diff --check
          git rm .github/workflows/_p0_exit_fill_timestamp_contract_patch.yml
          git rm .github/workflows/_p0_exit_fill_timestamp_contract_patch_v2.yml
          git rm .github/workflows/_p0_exit_fill_timestamp_contract_patch_v3.yml
          git rm .github/workflows/_p0_exit_fill_timestamp_contract_patch_v4.yml
          git add ap_reconciler.py ap/order_state_machine.py tests/test_p0_reconciler_exit_fill_timestamp_contract.py
          git diff --cached --check
          echo 'Changed files:'
          git diff --cached --name-only
          git config user.name "angelprecision"
          git config user.email "251777092+angelprecision@users.noreply.github.com"
          git commit -m "P0 fix reconciler EXIT fill timestamp contract"
          git push origin HEAD:fix/p0-exit-fill-timestamp-contract-20260910
