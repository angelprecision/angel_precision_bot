name: One-shot P0 EXIT fill timestamp contract patch v9

on:
  push:
    branches:
      - fix/p0-exit-fill-timestamp-contract-20260910
    paths:
      - .github/workflows/_p0_exit_fill_timestamp_contract_patch_v9.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-exit-fill-timestamp-contract-20260910
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply corrected audited patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/_p0_exit_fill_timestamp_contract_patch_v3.yml').read_text()
          begin = workflow.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = workflow.index("\n          PY\n", begin)
          script = textwrap.dedent(workflow[begin:end])

          old = 'mutate_segment("ap_reconciler.py", "    def _handle_stale_acknowledged_exits(\\n", "    def _reconcile_orders(\\n", patch_stale)'
          new = 'mutate_segment("ap_reconciler.py", "    def _handle_stale_acknowledged_exits(", "    def _reconcile_orders(", patch_stale)'
          assert old in script
          script = script.replace(old, new, 1)

          old = 'mutate_segment("ap_reconciler.py", "    def _resolve_missing_id_exit_truth(\\n", "    def _extract_explicit_cumulative_fill_qty(\\n", patch_missing)'
          new = 'mutate_segment("ap_reconciler.py", "    def _resolve_missing_id_exit_truth(", "    def _handle_order_without_broker_id(", patch_missing)'
          assert old in script
          script = script.replace(old, new, 1)

          old_helper = (
              'def replace_once(text, old, new, label):\n'
              '    n = text.count(old)\n'
              '    assert n == 1, f"{label}: expected one target, found {n}: {old[:100]!r}"\n'
              '    return text.replace(old, new, 1)'
          )
          new_helper = (
              'def replace_once(text, old, new, label):\n'
              '    if label == "normal terminal proof":\n'
              '        old = (\n'
              '            "                broker_order_id=str(\\n"\n'
              '            "                    broker_raw.get(\\\"id\\\")\\n"\n'
              '            "                    or broker_raw.get(\\\"order_id\\\")\\n"\n'
              '            "                    or broker_raw.get(\\\"broker_order_id\\\")\\n"\n'
              '            "                    or \\\"\\\"\\n"\n'
              '            "                ) or None,\\n"\n'
              '        )\n'
              '        new = (\n'
              '            "                broker_order_id=broker_order_id,\\n"\n'
              '            "                filled_ts=broker_filled_ts,\\n"\n'
              '        )\n'
              '    n = text.count(old)\n'
              '    if label == "stale honest corrected count":\n'
              '        assert n >= 1, f"{label}: expected at least one target, found {n}: {old[:100]!r}"\n'
              '        return text.replace(old, new, 1)\n'
              '    assert n == 1, f"{label}: expected one target, found {n}: {old[:100]!r}"\n'
              '    return text.replace(old, new, 1)'
          )
          assert old_helper in script
          script = script.replace(old_helper, new_helper, 1)
          Path('/tmp/apply_exit_fill_patch.py').write_text(script)
          PY

          python /tmp/apply_exit_fill_patch.py

          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_p0_reconciler_exit_fill_timestamp_contract.py')
          text = p.read_text()
          old = '    o = FakeOSM(); r = rec(o); s = summary()\n    r._get_recent_exit_fill = lambda c, u:'
          new = '    o = FakeOSM(); r = rec(o); s = summary()\n    r._recover_missing_broker_id_exit = lambda order, summary: False\n    r._get_recent_exit_fill = lambda c, u:'
          count = text.count(old)
          assert count == 2, f'expected two missing-id test anchors, found {count}'
          p.write_text(text.replace(old, new))
          PY

      - name: Compile touched files
        run: python -m py_compile ap_reconciler.py ap/order_state_machine.py tests/test_p0_reconciler_exit_fill_timestamp_contract.py

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests psycopg2-binary python-dotenv cryptography numpy pandas

      - name: Run focused regression tests
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
        run: pytest -q tests/test_p0_reconciler_exit_fill_timestamp_contract.py

      - name: Commit only audited patch
        shell: bash
        run: |
          git diff --check
          git rm .github/workflows/_p0_exit_fill_timestamp_contract_patch.yml
          git rm .github/workflows/_p0_exit_fill_timestamp_contract_patch_v2.yml
          git rm .github/workflows/_p0_exit_fill_timestamp_contract_patch_v3.yml
          git rm .github/workflows/_p0_exit_fill_timestamp_contract_patch_v4.yml
          git rm .github/workflows/_p0_exit_fill_timestamp_contract_patch_v5.yml
          git rm .github/workflows/_p0_exit_fill_timestamp_contract_patch_v6.yml
          git rm .github/workflows/_p0_exit_fill_timestamp_contract_patch_v7.yml
          git rm .github/workflows/_p0_exit_fill_timestamp_contract_patch_v8.yml
          git rm .github/workflows/_p0_exit_fill_timestamp_contract_patch_v9.yml
          git add ap_reconciler.py ap/order_state_machine.py tests/test_p0_reconciler_exit_fill_timestamp_contract.py
          git diff --cached --check
          echo 'Changed files:'
          git diff --cached --name-only
          git config user.name "angelprecision"
          git config user.email "251777092+angelprecision@users.noreply.github.com"
          git commit -m "P0 fix reconciler EXIT fill timestamp contract"
          git push origin HEAD:fix/p0-exit-fill-timestamp-contract-20260910
