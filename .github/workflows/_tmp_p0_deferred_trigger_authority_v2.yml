name: TEMP P0 deferred trigger authority v2 proof

on:
  push:
    branches:
      - fix/p0-deferred-trigger-authority-v2-scratch

jobs:
  focused-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-deferred-trigger-authority-v2-scratch
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Focused atomic trigger authority proof
        run: |
          python -m py_compile ap/order_state_machine.py
          pytest -q tests/test_p0_claim_deferred_requires_trigger_authority.py
          git diff --check
