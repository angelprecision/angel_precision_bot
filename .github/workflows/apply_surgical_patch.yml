name: Apply surgical terminal disposition patch

on:
  push:
    branches:
      - fix/p0-terminal-disposition-truth
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-terminal-disposition-truth
          fetch-depth: 0
      - name: Apply verified patch
        run: |
          git apply --check .github/patches/pr1.patch
          git apply .github/patches/pr1.patch
          rm .github/patches/pr1.patch
          rm .github/workflows/apply_surgical_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "P0: preserve truthful terminal disposition"
          git push origin HEAD:fix/p0-terminal-disposition-truth
