name: Materialize Soft Exit Truth PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'p0-soft-exit-executable-underlying-truth'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Commit reviewed implementation files
        shell: bash
        run: |
          cat .github/pr383_payload/part*.txt | base64 --decode > /tmp/p0-soft-exit-truth.tgz
          tar -xzf /tmp/p0-soft-exit-truth.tgz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ap_exit_engine/__init__.py ap/position_quote_monitor/__init__.py tests/test_p0_soft_exit_executable_truth.py
          git commit -m "P0: require executable option and fresh underlying truth for soft exits"
          git push
