name: Materialize Soft Exit Truth PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'p0-soft-exit-executable-underlying-truth'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Commit reviewed implementation files
        shell: bash
        run: |
          cat .github/pr383_payload/part*.txt | base64 --decode > /tmp/p0-soft-exit-truth.tgz
          tar -xzf /tmp/p0-soft-exit-truth.tgz
          cat > .github/workflows/p0_soft_exit_truth.yml <<'CLEAN_WORKFLOW'
          name: P0 Soft Exit Truth

          on:
            pull_request:
              branches:
                - main
              paths:
                - "ap_exit_engine.py"
                - "ap_exit_engine/**"
                - "ap/position_quote_monitor.py"
                - "ap/position_quote_monitor/**"
                - "tests/test_p0_soft_exit_executable_truth.py"
                - ".github/workflows/p0_soft_exit_truth.yml"

          jobs:
            focused-soft-exit-truth:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"
                - name: Install focused dependencies
                  run: |
                    python -m pip install --upgrade pip
                    pip install pytest requests psycopg2-binary python-dotenv cryptography numpy pandas
                - name: Run executable soft-exit truth regressions
                  env:
                    DATABASE_URL: "postgresql://test:test@localhost/test"
                  run: |
                    python -m pytest tests/test_p0_soft_exit_executable_truth.py -v --tb=short --color=yes
          CLEAN_WORKFLOW
          rm -rf .github/pr383_payload
          rm -f .github/workflows/materialize_soft_exit_truth.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "P0: require executable option and fresh underlying truth for soft exits"
          git push
