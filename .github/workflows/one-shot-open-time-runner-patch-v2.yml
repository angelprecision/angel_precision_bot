name: One-shot market-open runner patch v2

on:
  push:
    branches:
      - fix/open-time-overnight-autonomy-20260829

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/open-time-overnight-autonomy-20260829
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply exact source and test amendments
        run: python tools/one_shot_open_time_patch.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run morning autonomy regression suite
        run: |
          python -m pytest -q \
            tests/test_open_time_morning_autonomy.py \
            tests/test_p0_live_morning_jobs.py \
            tests/test_p0_autonomous_morning_handoff.py \
            tests/test_p0_overnight_reeval_retry_liveness.py \
            tests/test_p0_preopen_autonomous_readiness.py \
            tests/test_p0_readiness_deadline_enforcement.py

      - name: Verify money-path scope
        run: |
          git diff --check
          git diff -- client_runner.py ap/morning_jobs.py ap/preopen_readiness.py ap/scripts/live_morning_jobs.py render.yaml .github/workflows/overnight-reeval.yml .github/workflows/paper-morning-jobs.yml
          ! git diff -G 'submit_order\(|cancel_order\(|place_order\(' -- . ':!tests/**'

      - name: Commit exact patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "P0: enforce market-open overnight runtime boundary"
          git push origin HEAD:fix/open-time-overnight-autonomy-20260829