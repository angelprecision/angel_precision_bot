name: Live Morning Jobs

on:
  schedule:
    # Dual UTC schedules so the workflow keeps the intended Eastern-time jobs
    # across DST. The script itself guards the exact ET window and skips the
    # wrong-season invocation.
    - cron: "18 13 * * 1-5"
    - cron: "18 14 * * 1-5"
    - cron: "25 13 * * 1-5"
    - cron: "25 14 * * 1-5"
    - cron: "31 13 * * 1-5"
    - cron: "31 14 * * 1-5"
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run"
        required: true
        default: "overnight_reeval"
        type: choice
        options:
          - overnight_reeval
          - morning_handoff_primary
          - morning_handoff_backup

jobs:
  live-morning-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve scheduled job
        id: cfg
        run: |
          JOB=""
          case "${{ github.event.schedule }}" in
            "18 13 * * 1-5"|"18 14 * * 1-5") JOB="overnight_reeval" ;;
            "25 13 * * 1-5"|"25 14 * * 1-5") JOB="morning_handoff_primary" ;;
            "31 13 * * 1-5"|"31 14 * * 1-5") JOB="morning_handoff_backup" ;;
          esac
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            JOB="${{ github.event.inputs.job }}"
          fi
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
          echo "Resolved job=$JOB"

      - name: Run live morning job
        env:
          BOT_URL: ${{ secrets.AP_BOT_URL }}
          SIGNING_SECRET: ${{ secrets.AP_SIGNING_SECRET }}
          MORNING_JOB: ${{ steps.cfg.outputs.job }}
          MORNING_JOB_CLIENT_ID: jasoncosby1@gmail.com
          MORNING_JOB_EXECUTION_MODE: live
          MORNING_JOB_TIMEOUT_SECONDS: "180"
        run: |
          python3 ap/scripts/live_morning_jobs.py
