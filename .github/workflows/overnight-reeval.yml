name: Backup Morning Jobs

on:
  schedule:
    # GitHub Actions is BACKUP ONLY. Render Cron is primary at 09:30/09:32/09:36 ET.
    #
    # 09:40 retries the canonical LIVE overnight evaluator if the Render open-time
    # invocation was missed/delayed. The evaluator owns its post-overnight handoff.
    # 09:50 runs the canonical LIVE recovery batch once more.
    #
    # DST-safe dual UTC entries:
    #   09:40 EDT = 13:40 UTC   09:40 EST = 14:40 UTC
    #   09:50 EDT = 13:50 UTC   09:50 EST = 14:50 UTC
    # The script's ET-window guard rejects the wrong-season tick.
    - cron: "40 13 * * 1-5"
    - cron: "40 14 * * 1-5"
    - cron: "50 13 * * 1-5"
    - cron: "50 14 * * 1-5"
  workflow_dispatch:
    inputs:
      job:
        description: "Morning automation batch to run"
        required: true
        default: "morning_recovery"
        type: choice
        options:
          - overnight_reeval_batch
          - morning_handoff_primary
          - morning_handoff_backup
          - morning_recovery

concurrency:
  group: backup-morning-jobs-${{ github.event.schedule || github.event.inputs.job }}
  cancel-in-progress: false

jobs:
  backup-morning-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve scheduled batch
        id: cfg
        run: |
          JOB=""
          case "${{ github.event.schedule }}" in
            "40 13 * * 1-5"|"40 14 * * 1-5") JOB="overnight_reeval_batch" ;;
            "50 13 * * 1-5"|"50 14 * * 1-5") JOB="morning_recovery" ;;
          esac
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            JOB="${{ github.event.inputs.job }}"
          fi
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
          echo "Resolved job=$JOB"

      - name: Run backup LIVE morning automation
        env:
          BOT_URL: ${{ secrets.AP_BOT_URL }}
          SIGNING_SECRET: ${{ secrets.AP_SIGNING_SECRET }}
          MORNING_JOB: ${{ steps.cfg.outputs.job }}
          MORNING_JOB_LIVE_CLIENT: jasoncosby1@gmail.com
          MORNING_JOB_CLIENT_ID: jasoncosby1@gmail.com
          MORNING_JOB_EXECUTION_MODE: live
          MORNING_JOB_TIMEOUT_SECONDS: "180"
          MORNING_JOB_WINDOW_TOLERANCE_MINUTES: "20"
        run: |
          python3 -m ap.scripts.live_morning_jobs