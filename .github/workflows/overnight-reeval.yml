name: Backup Morning Jobs

on:
  schedule:
    # GitHub Actions is the BACKUP ONLY. Render Cron (render.yaml) is the
    # primary scheduler and runs the four batches at 09:18/09:26/09:32/09:36 ET.
    #
    # This backup runs ONCE, at a LATER recovery window (09:50 ET), well after
    # the last Render primary job (09:36 ET). It runs morning_recovery — the
    # idempotent catch-all batch — so it cannot race the Render primary windows.
    #
    # DST-safe dual UTC entries (Render uses UTC; GitHub Actions also uses UTC):
    #   09:50 EDT = 13:50 UTC
    #   09:50 EST = 14:50 UTC
    # The script's should_run_now() ET-window guard runs only the season-correct
    # tick and skips the other.
    #
    # Idempotency is enforced server-side via the admin endpoints' DB run-lock
    # (handoff_run_locks table — see app.py). Even if a Render job and this
    # backup both target morning_recovery, only one acquires the lock; the other
    # records skip_locked. job_window_key is NOT relied on as idempotency.
    - cron: "50 13 * * 1-5"   # 13:50 UTC = 09:50 EDT
    - cron: "50 14 * * 1-5"   # 14:50 UTC = 09:50 EST
  workflow_dispatch:
    inputs:
      job:
        description: "Morning automation batch to run"
        required: true
        default: "morning_recovery"
        type: choice
        options:
          - overnight_reeval_batch
          - morning_handoff_primary
          - morning_handoff_backup
          - morning_recovery

concurrency:
  group: backup-morning-jobs-${{ github.event.schedule || github.event.inputs.job }}
  cancel-in-progress: false

jobs:
  backup-morning-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install morning job runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input python-dotenv

      - name: Resolve scheduled batch
        id: cfg
        run: |
          JOB=""
          # Backup runs the idempotent recovery batch at the later 09:50 ET window.
          case "${{ github.event.schedule }}" in
            "50 13 * * 1-5"|"50 14 * * 1-5") JOB="morning_recovery" ;;
          esac
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            JOB="${{ github.event.inputs.job }}"
          fi
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
          echo "Resolved job=$JOB"

      - name: Run backup morning automation
        env:
          BOT_URL: ${{ secrets.AP_BOT_URL }}
          SIGNING_SECRET: ${{ secrets.AP_SIGNING_SECRET }}
          MORNING_JOB: ${{ steps.cfg.outputs.job }}
          MORNING_JOB_LIVE_CLIENT: jasoncosby1@gmail.com
          MORNING_JOB_PAPER_CLIENTS: jose.vasquez4011@gmail.com,tradefluencehq@gmail.com
          MORNING_JOB_TIMEOUT_SECONDS: "180"
          MORNING_JOB_WINDOW_TOLERANCE_MINUTES: "45"
        run: |
          python3 -m ap.scripts.live_morning_jobs
