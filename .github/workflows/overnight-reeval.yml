name: Overnight Reeval

on:
  schedule:
    # 9:03 AM ET (13:03 UTC EDT / 14:03 UTC EST) — primary
    # GitHub Actions cron can be delayed 5-30 min on high-traffic minutes.
    # All scheduled runs use force=true so a delayed runner never gets
    # blocked by the bot's 9:00-9:45 AM ET window guard.
    - cron: "3 13 * * 1-5"
    # 9:11 AM ET backup
    - cron: "11 13 * * 1-5"
    # 9:19 AM ET final safety net
    - cron: "19 13 * * 1-5"
    # 9:33 AM ET extra net — catches GitHub delays past 9:30
    - cron: "33 13 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: 'Force reeval regardless of time/day (true/false)'
        required: false
        default: 'false'

jobs:
  trigger-overnight-reeval:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger overnight reeval (HMAC signed)
        run: |
          # Scheduled runs always force=true — GitHub Actions delays can push
          # the run past the bot's time window, causing silent skips.
          # force=true bypasses the window guard so delayed runs still fire.
          IS_SCHEDULED="${{ github.event_name == 'schedule' }}"
          if [ "$IS_SCHEDULED" = "true" ]; then
            FORCE_FLAG="true"
          else
            FORCE_FLAG="${{ github.event.inputs.force || 'false' }}"
          fi

          BODY="{\"force\": ${FORCE_FLAG}}"

          TS=$(date +%s)
          BOT_URL="${{ secrets.AP_BOT_URL }}"
          SIGNING_SECRET="${{ secrets.AP_SIGNING_SECRET }}"

          SIG=$(printf "%s.%s" "$TS" "$BODY" | \
            openssl dgst -sha256 -hmac "$SIGNING_SECRET" -hex | \
            sed 's/^.* //')

          echo "Triggering overnight reeval at $(date -u) | bot=$BOT_URL | force=$FORCE_FLAG"

          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 90 \
            -X POST "${BOT_URL}/admin/overnight_reeval" \
            -H "Content-Type: application/json" \
            -H "X-AP-Timestamp: $TS" \
            -H "X-AP-Signature: $SIG" \
            -d "$BODY")

          echo "HTTP $HTTP_CODE"
          cat /tmp/response.txt
          echo ""

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Overnight reeval returned HTTP $HTTP_CODE"
            exit 1
          fi

          ARMED=$(cat /tmp/response.txt | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(d.get('armed', d.get('total_armed', 0)))" \
            2>/dev/null || echo "?")
          DEFERRED=$(cat /tmp/response.txt | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(d.get('deferred_contract',0))" \
            2>/dev/null || echo "0")
          echo "✅ Overnight reeval complete — $ARMED watcher(s) armed | $DEFERRED contract(s) deferred to breach"
