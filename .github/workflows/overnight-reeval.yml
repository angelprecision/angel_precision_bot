name: Overnight Reeval

on:
  schedule:
    # Primary: 9:00 AM ET (13:00 UTC) — validation + watcher arming
    - cron: "0 13 * * 1-5"
    # Backup: 9:10 AM ET (13:10 UTC) — catches missed primary runs
    - cron: "10 13 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: 'Force reeval regardless of time/day (true/false)'
        required: false
        default: 'false'

jobs:
  trigger-overnight-reeval:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger overnight reeval (HMAC signed)
        run: |
          # Scheduled runs never force — they run in the 9:00-9:45 AM ET window
          # where the time guard is already satisfied.
          # Manual dispatch uses the input; default is false to prevent
          # accidentally consuming WATCHING signals outside trading hours.
          FORCE_FLAG="${{ github.event.inputs.force || 'false' }}"
          BODY="{\"force\": ${FORCE_FLAG}}"

          TS=$(date +%s)
          BOT_URL="${{ secrets.AP_BOT_URL }}"
          SIGNING_SECRET="${{ secrets.AP_SIGNING_SECRET }}"

          # Compute HMAC: SHA256(timestamp.body)
          SIG=$(printf "%s.%s" "$TS" "$BODY" | \
            openssl dgst -sha256 -hmac "$SIGNING_SECRET" -hex | \
            sed 's/^.* //')

          echo "Triggering overnight reeval at $(date -u) | bot=$BOT_URL | force=$FORCE_FLAG"

          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 90 \
            -X POST "${BOT_URL}/admin/overnight_reeval" \
            -H "Content-Type: application/json" \
            -H "X-AP-Timestamp: $TS" \
            -H "X-AP-Signature: $SIG" \
            -d "$BODY")

          echo "HTTP $HTTP_CODE"
          cat /tmp/response.txt
          echo ""

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Overnight reeval returned HTTP $HTTP_CODE"
            exit 1
          fi

          ARMED=$(cat /tmp/response.txt | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(d.get('armed', d.get('total_armed', 0)))" \
            2>/dev/null || echo "?")
          DEFERRED=$(cat /tmp/response.txt | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(d.get('deferred_contract',0))" \
            2>/dev/null || echo "0")
          echo "✅ Overnight reeval complete — $ARMED watcher(s) armed | $DEFERRED contract(s) deferred to breach"
