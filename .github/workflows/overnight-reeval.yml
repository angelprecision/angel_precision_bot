name: Overnight Reeval

on:
  schedule:
    - cron: "5 13 * * 1-5"  # 6:05 AM PT (weekdays)
  workflow_dispatch:

jobs:
  trigger-overnight-reeval:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger overnight reeval (HMAC)
        run: |
          BODY='{"force": true}'
          TS=$(date +%s)

          SIG=$(printf "%s.%s" "$TS" "$BODY" | openssl dgst -sha256 -hmac "${{ secrets.AP_SIGNING_SECRET }}" -hex | sed 's/^.* //')

          curl -i -sS \
            --retry 3 \
            --retry-delay 5 \
            --max-time 60 \
            -X POST "${{ secrets.AP_BOT_URL }}/admin/overnight_reeval" \
            -H "Content-Type: application/json" \
            -H "X-AP-Timestamp: $TS" \
            -H "X-AP-Signature: $SIG" \
            -d "$BODY"
