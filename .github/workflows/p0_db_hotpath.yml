name: P0 DB Hot-Path Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - "*.py"
      - "*.sql"
      - "ap/**/*.py"
      - "sql/**/*.sql"
      - "migrations/20260811_orders_retry_hotpath_indexes.sql"
      - "tests/test_p0_profitability_db_hotpath.py"
      - ".github/workflows/p0_db_hotpath.yml"
  workflow_dispatch:

jobs:
  db-hotpath-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: p0_db_hotpath_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d p0_db_hotpath_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      P0_DB_HOTPATH_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/p0_db_hotpath_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest psycopg2-binary

      - name: Run DB hot-path and schema-shape contract
        run: pytest -q tests/test_p0_profitability_db_hotpath.py
