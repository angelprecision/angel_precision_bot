name: P0 Positions Meta Schema

on:
  pull_request:
    paths:
      - "ap/schema_attestation.py"
      - "ap/position_quote_monitor.py"
      - "migrations/20260811_positions_meta_hard_exit_reference.sql"
      - "tests/test_p0_positions_meta_schema_contract.py"
      - ".github/workflows/p0_positions_meta_schema.yml"
  workflow_dispatch:

jobs:
  positions-meta-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: angel_precision_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d angel_precision_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      P0_SCHEMA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/angel_precision_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/angel_precision_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest psycopg2-binary python-dotenv

      - name: Run positions.meta schema contract
        run: pytest -q tests/test_p0_positions_meta_schema_contract.py
