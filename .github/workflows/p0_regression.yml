name: P0 Regression Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  p0-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intelligence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d intelligence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spec/p0-deferred-real-cost-revalidation-20260814
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests psycopg2-binary python-dotenv cryptography numpy pandas

      - name: Apply exact-anchor PR474 implementation
        run: python scripts/apply_pr474_rebased_patch.py

      - name: Syntax and diff proof
        run: |
          python -m py_compile ap_execution_core.py
          python -m py_compile tests/test_p0_deferred_real_cost_revalidation.py
          git diff --check

      - name: Run PR474 focused and adjacent tests
        env:
          PGSSLMODE: "disable"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/intelligence_test?sslmode=disable"
          INTELLIGENCE_POSTGRES_TEST_URL: "postgresql://postgres:postgres@localhost:5432/intelligence_test?sslmode=disable"
        run: |
          python -m pytest \
            tests/test_p0_deferred_real_cost_revalidation.py \
            tests/test_p0_seam4_e2e_deferred_lifecycle.py \
            tests/test_p0_deferred_breach_submit_repair.py \
            tests/test_p0_fresh_sync_live_submit_quote.py \
            tests/test_p0_live_submit_gates.py \
            -v --tb=short --color=yes

      - name: Commit production implementation and restore permanent P0 workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git show origin/main:.github/workflows/p0_regression.yml > .github/workflows/p0_regression.yml
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/p0_regression.yml')
          text = p.read_text()
          anchor = '            tests/test_p0_seam4_e2e_deferred_lifecycle.py \\\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'P0 registration anchor count={text.count(anchor)}')
          text = text.replace(
              anchor,
              anchor + '            tests/test_p0_deferred_real_cost_revalidation.py \\\n',
              1,
          )
          p.write_text(text)
          PY
          git add ap_execution_core.py .github/workflows/p0_regression.yml
          git diff --cached --exit-code && { echo 'No implementation diff produced'; exit 1; } || true
          git commit -m 'fix(pr474): revalidate deferred entries at final broker-ready cost'
          git push origin HEAD:spec/p0-deferred-real-cost-revalidation-20260814
