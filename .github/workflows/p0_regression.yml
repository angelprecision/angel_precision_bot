name: P0 Regression Suite

# Runs the canonical P0 + cohesion tests on every PR and push to main.
# This is the gate that prevents regressions to:
#   - P0-1 exit retry / idempotency
#   - P0-2 entry retry / idempotency
#   - P0-3 force-close circuit breaker (entry-gate + tick self-check)
#   - P0-5 silent-swallow conversion
#   - PR #16 funnel-leak fixes
#   - Readiness contract
#   - Reason-code taxonomy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  p0-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests psycopg2-binary
          # Most production deps not needed — tests use mocks. If a future
          # test pulls a real dep, add it here individually rather than
          # installing the full bot stack.

      - name: Run P0 + cohesion test suite
        env:
          # Tests use mocks for DB — this is just to satisfy any module
          # that requires DATABASE_URL at import time.
          DATABASE_URL: "postgresql://test:test@localhost/test"
        run: |
          python -m pytest \
            tests/test_osm_retry_idempotency.py \
            tests/test_force_close_breaker.py \
            tests/test_readiness_contract.py \
            tests/test_funnel_fixes.py \
            tests/test_p0_regression_suite.py \
            -v --tb=short --color=yes

      - name: Summary
        if: always()
        run: |
          echo "P0 regression suite covers:"
          echo "  - P0-1 exit submission retry + idempotency"
          echo "  - P0-2 entry submission retry + idempotency"
          echo "  - P0-3 daily-loss force-close (entry-gate + tick self-check)"
          echo "  - P0-5 silent-swallow reduction (count threshold)"
          echo "  - PR #16 funnel-leak fixes + corrections"
          echo "  - Single readiness contract"
          echo "  - Reason-code taxonomy"
          echo "  - All 16 critical modules import clean"
