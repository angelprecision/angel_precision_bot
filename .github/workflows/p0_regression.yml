name: P0 Regression Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  p0-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intelligence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d intelligence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests psycopg2-binary python-dotenv cryptography

      - name: Apply exit decision generation migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d intelligence_test \
            -f migrations/20260717_exit_decision_generation_claims.sql
          psql -h localhost -U postgres -d intelligence_test \
            -tAc "SELECT to_regclass('public.exit_decision_generation_claims') IS NOT NULL" \
            | grep -qx t

      - name: Validate positions execution-mode migration
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres position_mode_migration_test
          psql -h localhost -U postgres -d position_mode_migration_test -v ON_ERROR_STOP=1 -c \
            "CREATE TABLE positions (id text PRIMARY KEY, client_id text, local_order_id text, broker_order_id text); CREATE TABLE orders (id text PRIMARY KEY, client_id text, kind text, local_order_id text, broker_order_id text, execution_mode text); INSERT INTO positions VALUES ('unique','client@example.com','local-1',NULL),('unknown','client@example.com','missing',NULL),('ambiguous','client@example.com','local-2','broker-2'); INSERT INTO orders VALUES ('order-1','client@example.com','ENTRY','local-1',NULL,'LIVE'),('order-2','client@example.com','ENTRY','local-2',NULL,'paper'),('order-3','client@example.com','ENTRY',NULL,'broker-2','paper');"
          psql -h localhost -U postgres -d position_mode_migration_test \
            --single-transaction -v ON_ERROR_STOP=1 \
            -f migrations/20260719032517_add_positions_execution_mode.sql
          psql -h localhost -U postgres -d position_mode_migration_test \
            -tAc "SELECT execution_mode FROM positions WHERE id='unique'" \
            | grep -qx live
          psql -h localhost -U postgres -d position_mode_migration_test \
            -tAc "SELECT count(*) FROM positions WHERE id IN ('unknown','ambiguous') AND execution_mode IS NULL" \
            | grep -qx 2
          dropdb -h localhost -U postgres position_mode_migration_test

      - name: Run P0 plus cohesion tests
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/intelligence_test"
          INTELLIGENCE_POSTGRES_TEST_URL: "postgresql://postgres:postgres@localhost:5432/intelligence_test"
        run: |
          python -m pytest \
            tests/test_osm_retry_idempotency.py \
            tests/test_force_close_breaker.py \
            tests/test_readiness_contract.py \
            tests/test_funnel_fixes.py \
            tests/test_p0_regression_suite.py \
            tests/test_p0_entry_metadata_guard.py \
            tests/test_p0_trade_flow_contracts.py \
            tests/test_p0_fresh_sync_live_submit_quote.py \
            tests/test_p0_canonical_live_entry_confirmation.py \
            tests/test_p0_deferred_breach_lifecycle_completion.py \
            tests/test_p0_amendment10_recovery_full_wiring.py \
            tests/test_p0_amendment11_ownership_through_cleanup.py \
            tests/test_p0_watcher_recovery_execution_ownership.py \
            tests/test_p0_watcher_conflict_cancellation_proof.py \
            tests/test_p0_seam1_pre_submit_proof_retry.py \
            tests/test_p0_seam2_timing_boundary.py \
            tests/test_p0_selector_retry_taxonomy.py \
            tests/test_p1_selector_identity_assertion_mode_fallback.py \
            tests/test_p1_intelligence_admission_policy.py \
            tests/test_p1_intel_admission_e2e_final_gate.py \
            tests/test_p0_forward_regime_advisory_flow.py \
            tests/test_p0_seam4_e2e_deferred_lifecycle.py \
            tests/test_p0_intelligence_postgres.py \
            tests/test_p0_pending_trigger_restart_recovery.py \
            tests/test_entry_watcher_audit.py \
            tests/test_p0_watcher_invalidation_ownership.py \
            tests/test_p0_broker_open_protective_monitoring.py \
            tests/test_p0_final_duplicate_honesty.py \
            tests/test_p0_setup_lifecycle_owner.py \
            tests/test_p0_autonomous_startup_scheduler_contract.py \
            tests/test_p0_autonomous_morning_handoff.py \
            tests/test_p0_deferred_due_retry_ownership.py \
            tests/test_p0_watcher_materialization_ownership.py \
            tests/test_p0_fenced_retry_terminalization.py \
            tests/test_p0_deferred_materialization_copyback_before_proof.py \
            tests/test_p0_amendment3_monotonic_generation_fencing.py \
            tests/test_p0_amendment6_broker_ambiguity_reconciler.py \
            tests/test_p0_osm_broker_submit_boundary.py \
            tests/test_p0_exit_closed_guard_and_circuit_breaker.py \
            tests/test_p0_unknown_execution_mode_fail_closed.py \
            tests/test_p0_live_executable_bid_pnl.py \
            tests/test_p0_canonical_exit_fill_truth.py \
            tests/test_p0_partial_exit_ownership_guard.py \
            tests/test_p0_exit_position_ambiguity_guard.py \
            tests/test_p0_exit_decision_idempotency_guard.py \
            tests/test_p0_proof_entry_identity_and_taxonomy.py \
            tests/test_p0_proof_taxonomy_fill_bridge.py \
            tests/test_p0_terminal_close_proof_binding.py \
            tests/test_p1_expired_contract_db_close_repair.py \
            tests/test_p0_reconciler_proof_persistence.py \
            tests/test_p0_expired_broker_import_idempotency.py \
            tests/test_p0_broker_confirmed_daily_trade_count.py \
            tests/test_p0_schema_attestation_and_migration_runner.py \
            tests/test_p0_position_execution_mode_schema.py \
            tests/test_p0_live_startup_preflight.py \
            tests/test_p0_live_one_contract_runner_precedence.py \
            tests/test_p0_paper_recovery_restart_guard_bypass.py \
            -v --tb=short --color=yes

      - name: Summary
        if: always()
        run: |
          echo "P0 regression suite complete"
