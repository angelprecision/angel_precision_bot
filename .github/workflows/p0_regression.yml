jobs:
  p0-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intelligence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d intelligence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Test the submitted PR head, not GitHub's synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert checked out commit
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests psycopg2-binary python-dotenv cryptography numpy pandas

      - name: Apply exit decision generation migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d intelligence_test \
            -f migrations/20260717_exit_decision_generation_claims.sql
          psql -h localhost -U postgres -d intelligence_test \
            -f migrations/20260809_exit_decision_generation_requested_qty.sql
          psql -h localhost -U postgres -d intelligence_test \
            -tAc "SELECT to_regclass('public.exit_decision_generation_claims') IS NOT NULL AND EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='exit_decision_generation_claims' AND column_name='requested_qty')" \
            | grep -qx t

      - name: Validate positions execution-mode migration
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres position_mode_migration_test
          psql -h localhost -U postgres -d position_mode_migration_test -v ON_ERROR_STOP=1 -c \
            "CREATE TABLE positions (id text PRIMARY KEY, client_id text, local_order_id text, broker_order_id text); CREATE TABLE orders (id text PRIMARY KEY, client_id text, kind text, local_order_id text, broker_order_id text, execution_mode text); INSERT INTO positions VALUES ('unique','client@example.com','local-1',NULL),('unknown','client@example.com','missing',NULL),('ambiguous','client@example.com','local-2','broker-2'); INSERT INTO orders VALUES ('order-1','client@example.com','ENTRY','local-1',NULL,'LIVE'),('order-2','client@example.com','ENTRY','local-2',NULL,'paper'),('order-3','client@example.com','ENTRY',NULL,'broker-2','paper');"
          psql -h localhost -U postgres -d position_mode_migration_test \
            --single-transaction -v ON_ERROR_STOP=1 \
            -f migrations/20260719032517_add_positions_execution_mode.sql
          psql -h localhost -U postgres -d position_mode_migration_test \
            -tAc "SELECT execution_mode FROM positions WHERE id='unique'" \
            | grep -qx live
          psql -h localhost -U postgres -d position_mode_migration_test \
            -tAc "SELECT count(*) FROM positions WHERE id IN ('unknown','ambiguous') AND execution_mode IS NULL" \
            | grep -qx 2
          dropdb -h localhost -U postgres position_mode_migration_test

      - name: Run P0 plus cohesion tests
        env:
          # PR #388 CI fix: PGSSLMODE=disable so ap.db never tries SSL
          # against CI's localhost Postgres. Prior runs hit
          # "server does not support SSL, but SSL was required" on every
          # DB access, which caused source-truth tests that legitimately
          # patch _fetch_watching_signals to instead fail because the
          # compat layer's fallback path attempted an SSL connect.
          PGSSLMODE: "disable"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/intelligence_test?sslmode=disable"
          INTELLIGENCE_POSTGRES_TEST_URL: "postgresql://postgres:postgres@localhost:5432/intelligence_test?sslmode=disable"
          MANUAL_CLOSE_POSTGRES_TEST_URL: "postgresql://postgres:postgres@localhost:5432/intelligence_test?sslmode=disable"
        run: |
          python -m pytest ${P0_TEST_INVENTORY} -v --tb=short --color=yes

      - name: Summary
        if: always()
        run: |
          echo "P0 regression suite complete"


