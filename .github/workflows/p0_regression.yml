name: P0 Regression — Regime Veto Taxonomy and Overnight Rescue

on:
  push:
    branches:
      - fix/p0-regime-veto-taxonomy-and-rescue
      - main
  pull_request:
    branches:
      - main

jobs:
  p0-regression:
    name: P0 suite — must pass at HEAD SHA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-timeout
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Confirm head SHA
        run: |
          echo "HEAD SHA: ${{ github.sha }}"
          git log -1 --oneline

      - name: Run P0 taxonomy tests
        run: |
          pytest tests/test_p0_live_regime_veto_taxonomy.py \
            -v --tb=short --timeout=60 \
            -p no:warnings

      - name: Run P0 rescue tests
        run: |
          pytest tests/test_p0_live_overnight_regime_rescue.py \
            -v --tb=short --timeout=60 \
            -p no:warnings

      - name: Fail on any P0 test failure
        if: failure()
        run: |
          echo "P0 regression tests FAILED. Do not merge until all tests pass at HEAD SHA."
          exit 1
