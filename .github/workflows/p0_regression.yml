  p0-rollback-failfirst:
    # Checks out the verified pre-#579 rollback base and runs an INLINE
    # fail-first script.  This job must NOT execute any test file introduced
    # by #579 — those files do not exist on the rollback base.
    # The inline script proves the production defect: EXIT_FILLED is durable
    # but the canonical position remains OPEN on the rollback base.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intelligence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d intelligence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eb1fdefd8fb35effd1752a8a4de50147c06b066b

      - name: Assert rollback base SHA
        run: |
          expected="eb1fdefd8fb35effd1752a8a4de50147c06b066b"
          actual="$(git rev-parse HEAD)"
          echo "Rollback base: $actual"
          test "$actual" = "$expected"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests psycopg2-binary python-dotenv cryptography numpy pandas

      - name: Apply migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d intelligence_test \
            -f migrations/20260717_exit_decision_generation_claims.sql || true
          psql -h localhost -U postgres -d intelligence_test \
            -f migrations/20260809_exit_decision_generation_requested_qty.sql || true

      - name: Run inline rollback fail-first proof
        env:
          PGSSLMODE: "disable"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/intelligence_test?sslmode=disable"
          INTELLIGENCE_POSTGRES_TEST_URL: "postgresql://postgres:postgres@localhost:5432/intelligence_test?sslmode=disable"
        run: |
          python - << 'PYEOF'
          import os, sys
          os.environ["DATABASE_URL"] = os.environ["INTELLIGENCE_POSTGRES_TEST_URL"]

          import psycopg2, psycopg2.extras
          from datetime import datetime, timezone

          CLIENT_ID       = "jason-rollback-test@example.com"
          POSITION_UUID   = "70360b2a-9036-4e2d-bb6b-bf8d0065f6ef"
          REPAIR_EXIT_UUID = "9c430437-2973-4811-8776-1d353b925d9b"
          BROKER_ORDER_ID = "145130405"
          OCC_CONTRACT    = "QQQ261121C00510000"
          ENTRY_TS = datetime(2026, 9, 9, 13, 30, 0, tzinfo=timezone.utc)
          FILL_TS  = datetime(2026, 9, 9, 15, 42, 18, tzinfo=timezone.utc)
          FILL_PRICE = 1.17
          ENTRY_PRICE = 1.48

          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          conn.autocommit = False
          cur = conn.cursor(cursor_factory=psycopg2.extras.RealDictCursor)

          # --- Schema ---
          cur.execute("""
          CREATE TEMP TABLE positions (
            id TEXT PRIMARY KEY, client_id TEXT NOT NULL,
            execution_mode TEXT, contract TEXT, side TEXT, direction TEXT,
            status TEXT, qty INTEGER, quantity_remaining INTEGER,
            avg_fill NUMERIC, entry_price NUMERIC,
            exit_price NUMERIC, realized_pnl NUMERIC, realized_pnl_pct NUMERIC,
            entry_ts TIMESTAMPTZ, exit_ts TIMESTAMPTZ,
            local_order_id TEXT, broker_order_id TEXT,
            contracts_exited INTEGER, close_source TEXT,
            close_confidence TEXT, exit_reason TEXT, updated_at TIMESTAMPTZ,
            exit_in_flight BOOLEAN, pending_exit_qty INTEGER,
            pending_exit_local_order_id TEXT, pending_exit_broker_order_id TEXT
          )""")
          cur.execute("""
          CREATE TEMP TABLE orders (
            local_order_id TEXT PRIMARY KEY, position_id TEXT,
            client_id TEXT NOT NULL, execution_mode TEXT, kind TEXT,
            status TEXT, contract TEXT, direction TEXT, qty INTEGER,
            filled_qty INTEGER, fill_price NUMERIC, filled_ts TIMESTAMPTZ,
            broker_order_id TEXT, meta JSONB, updated_ts TIMESTAMPTZ
          )""")
          cur.execute("""
          CREATE TEMP TABLE proof_trades (
            id TEXT PRIMARY KEY, client_email TEXT NOT NULL,
            position_id TEXT, local_order_id TEXT, system_version TEXT,
            exit_option_price NUMERIC, option_pnl_pct NUMERIC, win BOOLEAN,
            broker_reconciled BOOLEAN DEFAULT FALSE
          )""")

          # --- Seed September 9 shape (broker-repair, avg_fill=NULL) ---
          cur.execute(
            "INSERT INTO positions (id, client_id, execution_mode, contract, side, direction, status, qty, quantity_remaining, avg_fill, entry_price, entry_ts, local_order_id, updated_at) VALUES (%s,%s,'live',%s,'CALL','CALL','OPEN',1,1,NULL,NULL,%s,'entry-order-qqq',NOW())",
            (POSITION_UUID, CLIENT_ID, OCC_CONTRACT, ENTRY_TS)
          )
          cur.execute(
            "INSERT INTO orders (local_order_id, position_id, client_id, execution_mode, kind, status, contract, direction, qty, filled_qty, fill_price, filled_ts, broker_order_id, meta, updated_ts) VALUES ('entry-order-qqq',%s,%s,'live','ENTRY','FILLED',%s,'CALL',1,1,%s,%s,'entry-broker-001','{}',NOW())",
            (POSITION_UUID, CLIENT_ID, OCC_CONTRACT, ENTRY_PRICE, ENTRY_TS)
          )
          cur.execute(
            "INSERT INTO orders (local_order_id, position_id, client_id, execution_mode, kind, status, contract, direction, qty, filled_qty, fill_price, filled_ts, broker_order_id, meta, updated_ts) VALUES (%s,%s,%s,'live','EXIT','EXIT_REQUESTED',%s,'CALL',1,NULL,NULL,NULL,%s,'{}',NOW())",
            (REPAIR_EXIT_UUID, POSITION_UUID, CLIENT_ID, OCC_CONTRACT, BROKER_ORDER_ID)
          )
          conn.commit()

          # --- Verify pre-condition ---
          cur.execute("SELECT status, quantity_remaining, exit_price FROM positions WHERE id=%s", (POSITION_UUID,))
          pos_before = dict(cur.fetchone())
          assert pos_before["status"] == "OPEN", f"Pre-condition failed: {pos_before}"
          assert pos_before["quantity_remaining"] == 1
          assert pos_before["exit_price"] is None

          # --- Run OSM transition (production caller path) ---
          from ap.db import _ConnWrapper
          import ap.db as db_mod, ap.position_manager as pm_mod, ap.order_state_machine as osm_mod
          from contextlib import contextmanager

          @contextmanager
          def _conn():
            cur2 = conn.cursor(cursor_factory=psycopg2.extras.RealDictCursor)
            try:
              yield _ConnWrapper(conn, cur2)
              conn.commit()
            except Exception:
              conn.rollback()
              raise
            finally:
              cur2.close()

          db_mod.conn  = _conn
          db_mod.run_with_retry  = lambda fn, **kw: fn()
          pm_mod.conn  = _conn
          pm_mod.run_with_retry  = lambda fn, **kw: fn()
          osm_mod.conn = _conn
          osm_mod.run_with_retry = lambda fn, **kw: fn()

          from unittest.mock import MagicMock
          ee = MagicMock(); ee.get_position = MagicMock(return_value=None); ee._positions = {}
          osm_mod._get_exit_engine_for_client = lambda _: ee

          from ap.order_state_machine import APOrderStateMachine
          osm = APOrderStateMachine(CLIENT_ID)
          ok = osm.transition(
            REPAIR_EXIT_UUID, "EXIT_FILLED",
            filled_qty=1, fill_price=FILL_PRICE,
            broker_order_id=BROKER_ORDER_ID, filled_ts=FILL_TS,
          )

          # --- Fail-first assertion: position must still be OPEN ---
          cur.execute("SELECT status, quantity_remaining, exit_price FROM positions WHERE id=%s", (POSITION_UUID,))
          pos_after = dict(cur.fetchone())
          print(f"Position after OSM transition: {pos_after}")

          if pos_after["status"] == "CLOSED" and pos_after["quantity_remaining"] == 0:
            print("FAIL-FIRST: Position was unexpectedly CLOSED on rollback base.")
            print("This means the rollback base already has the fix — check the checkout SHA.")
            sys.exit(1)

          # On rollback base, position should remain OPEN (the defect we're proving)
          assert pos_after["status"] == "OPEN", (
            f"FAIL-FIRST PASSED: Position correctly remains OPEN on rollback base. "
            f"Got status={pos_after['status']!r} — this is the expected defect behavior."
            if pos_after["status"] == "OPEN" else
            f"Unexpected status {pos_after['status']!r} on rollback base."
          )
          print(f"PASS: Position remains OPEN on rollback base (defect confirmed). status={pos_after['status']!r}")
          PYEOF

      - name: Summary
        if: always()
        run: |
          echo "Rollback fail-first complete."
          echo "Expected: position remains OPEN on pre-#579 base (defect confirmed)."

  p0-612-rollback-failfirst:
    # PR #612 rollback proof: run the real restart-recovery caller and two
    # confirmed CALL polls on the exact pre-fix main SHA.  The old base must
    # leave lifecycle state at NONE, record an illegal NONE -> TRIGGER_READY,
    # and therefore produce zero successful trigger callbacks.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intelligence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d intelligence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7a07f11a4e16a6d16ac0248cea4614559d5a054e

      - name: Assert PR #612 rollback base SHA
        run: |
          expected="7a07f11a4e16a6d16ac0248cea4614559d5a054e"
          actual="$(git rev-parse HEAD)"
          echo "PR #612 rollback base: $actual"
          test "$actual" = "$expected"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests psycopg2-binary python-dotenv cryptography numpy pandas

      - name: Run PR #612 rollback fail-first proof
        env:
          PGSSLMODE: "disable"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/intelligence_test?sslmode=disable"
        run: |
          python - << 'PYEOF'
          from copy import deepcopy
          from unittest.mock import MagicMock

          import ap_entry_watcher as ew
          import ap_lifecycle
          from ap.pending_trigger_restart_recovery import (
              PendingTriggerRestartRecovery,
              _RowOutcome,
          )

          SIGNAL_ID = "c493c9dc-ceaa-4c86-8b62-08c3cc8bad5c"
          LOCAL_ORDER_ID = "d6dd2c80-d0a1-45ca-bda9-4813ba7e64ba"
          CLIENT_ID = "jasoncosby1@gmail.com"
          ROW = {
              "local_order_id": LOCAL_ORDER_ID,
              "client_id": CLIENT_ID,
              "execution_mode": "live",
              "kind": "ENTRY",
              "status": "PENDING_TRIGGER",
              "signal_id": SIGNAL_ID,
              "canonical_signal_id": SIGNAL_ID,
              "symbol": "MSFT",
              "ticker": "MSFT",
              "contract": "DEFERRED:MSFT",
              "direction": "CALL",
              "entry_price": 494.52,
              "stop_price": 489.44,
              "target_price": 505.00,
              "broker_order_id": None,
              "submitted_ts": None,
              "meta": {
                  "client_id": CLIENT_ID,
                  "execution_mode": "live",
                  "signal_id": SIGNAL_ID,
                  "canonical_signal_id": SIGNAL_ID,
                  "side": "CALL",
                  "direction": "CALL",
                  "trigger_price": 494.52,
                  "stop_price": 489.44,
                  "target_price": 505.00,
              },
          }

          class RollbackOSM:
              def __init__(self):
                  self.row = deepcopy(ROW)
                  self.meta_writes = []
                  self.cancel_calls = []
                  self.submit_calls = []

              def get_order(self, local_order_id):
                  return deepcopy(self.row) if local_order_id == LOCAL_ORDER_ID else None

              def update_order_meta(self, local_order_id, patch, **kwargs):
                  self.meta_writes.append((local_order_id, deepcopy(patch), kwargs))
                  self.row["meta"].update(dict(patch))
                  return True

              def cancel_pending_entry(self, local_order_id, **kwargs):
                  self.cancel_calls.append((local_order_id, kwargs))
                  return True

              def submit_existing_entry(self, local_order_id, **kwargs):
                  self.submit_calls.append((local_order_id, kwargs))
                  return True

          osm = RollbackOSM()
          watcher = ew.APEntryWatcher(
              MagicMock(), order_state_machine=osm,
              require_on_trigger=False, mode="LIVE",
          )
          watcher._persist_watcher_audit = MagicMock()
          watcher._is_regular_session_now = MagicMock(return_value=False)
          watcher._is_past_entry_cutoff_now = MagicMock(return_value=False)
          watcher._get_quote = MagicMock(
              return_value={"bid": 494.50, "ask": 494.51}
          )

          with ap_lifecycle.LEDGER._entry_lock:
              ap_lifecycle.LEDGER._current_state.pop(SIGNAL_ID, None)

          recovery = PendingTriggerRestartRecovery(
              client_id=CLIENT_ID,
              execution_mode="live",
              osm=osm,
              entry_watcher=watcher,
              broker=MagicMock(),
              quote_check_fn=lambda *_args: False,
              caller_source="p0_612_rollback_failfirst",
          )
          assert recovery.recover_one_row(ROW) == _RowOutcome.WATCHER_OWNED
          assert len(watcher._pending) == 1
          assert ap_lifecycle.LEDGER.current_state(SIGNAL_ID) is None

          callback_calls = []
          successful_callbacks = []

          def on_trigger(watched):
              callback_calls.append(watched.signal_id)
              if ap_lifecycle.LEDGER.current_state(SIGNAL_ID) != ap_lifecycle.SignalState.TRIGGER_READY:
                  # This is the production failure boundary: the old base
                  # cannot authorize downstream entry work from NONE.
                  return None
              successful_callbacks.append(watched.signal_id)
              return {"disposition": "KEEP_WATCHER"}

          watcher.on_trigger = on_trigger
          watcher._fetch_quotes = MagicMock(
              return_value={"MSFT": {"bid": 494.50, "ask": 494.53}}
          )
          watcher._poll_active_signals(False)
          watcher._poll_active_signals(False)

          assert len(callback_calls) == 1
          assert successful_callbacks == [], (
              "rollback base unexpectedly reached a valid trigger callback"
          )
          assert ap_lifecycle.LEDGER.current_state(SIGNAL_ID) is None
          assert any(
              entry.to_state == ap_lifecycle.SignalState.ERROR
              for entry in ap_lifecycle.LEDGER.history(SIGNAL_ID)
          ), "rollback base did not record the illegal NONE -> TRIGGER_READY"
          assert osm.cancel_calls == []
          assert osm.submit_calls == []
          print(
              "PASS: PR #612 fail-first reproduced on pinned base — "
              "NONE -> TRIGGER_READY stayed illegal and no successful callback ran."
          )
          PYEOF
