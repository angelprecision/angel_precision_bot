name: PR383 DB Shape Amendment

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  amend:
    if: github.head_ref == 'p0-soft-exit-executable-underlying-truth'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Amend production row shape
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ap_exit_engine/__init__.py')
          s = p.read_text()
          s = s.replace("SELECT COALESCE(meta, '{}'::jsonb)\n", "SELECT COALESCE(meta, '{}'::jsonb) AS meta\n")
          s = s.replace("""                    row = c.fetchone()\n                    return row[0] if row else {}\n""", """                    row = c.fetchone()\n                    if not row:\n                        return {}\n                    if hasattr(row, 'get'):\n                        return row.get('meta') or {}\n                    return row[0]\n""")
          s = s.replace("COALESCE(contract, option_symbol, '') = %s", "COALESCE(NULLIF(contract, ''), option_symbol, '') = %s")
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ap_exit_engine/__init__.py
          git commit -m "P0: preserve production DB row and contract shapes"
          git push
