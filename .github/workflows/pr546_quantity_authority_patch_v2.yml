name: PR546 quantity-authority staging patch v2

on:
  push:
    branches:
      - pr546-quantity-authority-41ad9fd3

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source head remains audited
        run: |
          test "$(git merge-base HEAD 41ad9fd3dd420b07192ce27367021bac2ce252bf)" = "41ad9fd3dd420b07192ce27367021bac2ce252bf"

      - name: Recover and run corrected surgical patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lines = Path('.github/workflows/pr546_quantity_authority_patch.yml').read_text().splitlines()
          script = []
          inside = False
          for line in lines:
              if line.strip() == "cat > /tmp/patch_pr546.py <<'PY'":
                  inside = True
                  continue
              if inside and line.strip() == 'PY':
                  break
              if inside:
                  if line == '':
                      script.append('')
                      continue
                  if not line.startswith('          '):
                      raise SystemExit(f'unexpected patch-script indentation: {line!r}')
                  script.append(line[10:])
          if not script:
              raise SystemExit('could not recover staging patch script')
          source = '\n'.join(script) + '\n'
          count = source.count("append = r'''")
          if count != 1:
              raise SystemExit(f'expected one raw append string, found {count}')
          source = source.replace("append = r'''", "append = '''", 1)
          Path('/tmp/patch_pr546_v2.py').write_text(source)
          PY
          python /tmp/patch_pr546_v2.py
          rm -f .github/workflows/pr546_quantity_authority_patch_v2.yml

      - name: Syntax check
        run: python -m py_compile ap_reconciler.py ap_exit_engine.py tests/test_p0_reconciler_canonical_owner_adoption.py

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests psycopg2-binary python-dotenv cryptography numpy pandas

      - name: Run focused PR546 tests
        env:
          PGSSLMODE: "disable"
        run: python -m pytest -q tests/test_p0_reconciler_canonical_owner_adoption.py

      - name: Verify final cumulative diff is surgical
        run: |
          git diff --check
          changed="$(git diff --name-only 41ad9fd3dd420b07192ce27367021bac2ce252bf | sort)"
          expected="$(printf '%s\n' ap_exit_engine.py ap_reconciler.py tests/test_p0_reconciler_canonical_owner_adoption.py | sort)"
          printf 'changed files:\n%s\n' "$changed"
          test "$changed" = "$expected"

      - name: Commit staged correction
        run: |
          git config user.name "angelprecision-pr546-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve canonical quantity authority across recovery"
          git push origin HEAD:pr546-quantity-authority-41ad9fd3
          echo "PATCH_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Show patch head
        run: echo "$PATCH_HEAD"