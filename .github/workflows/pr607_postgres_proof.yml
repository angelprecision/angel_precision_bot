name: PR607 PostgreSQL Proof

on:
  pull_request:
    branches:
      - main

jobs:
  pr607-postgres-proof:
    if: github.event.pull_request.number == 607
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intelligence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d intelligence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Assert checked out PR head
        run: |
          expected="${{ github.event.pull_request.head.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests psycopg2-binary python-dotenv cryptography numpy pandas

      - name: Run PR607 focused PostgreSQL replay
        env:
          PGSSLMODE: "disable"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/intelligence_test?sslmode=disable"
          INTELLIGENCE_POSTGRES_TEST_URL: "postgresql://postgres:postgres@localhost:5432/intelligence_test?sslmode=disable"
        run: |
          python -m pytest tests/test_p0_pr596_due_materialization_retry_liveness.py -v --tb=short --color=yes
