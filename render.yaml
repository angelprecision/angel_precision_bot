# render.yaml — Render Cron is the PRIMARY scheduler for market-open morning jobs.
#
# CRITICAL: Render evaluates cron expressions in UTC, NOT local time. Setting
# TZ=America/New_York affects the process clock but NOT when the cron fires.
# Schedules below are therefore expressed in UTC, with DUAL entries to cover
# both EDT (UTC-4) and EST (UTC-5). The script's own ET-window guard
# (should_run_now) then runs the correct batch and skips the wrong-season tick.
#
#   Target ET   EDT (UTC-4)   EST (UTC-5)   MORNING_JOB
#   ─────────   ───────────   ───────────   ───────────
#   09:18 ET    13:18 UTC     14:18 UTC     overnight_reeval_batch
#   09:26 ET    13:26 UTC     14:26 UTC     morning_handoff_primary
#   09:32 ET    13:32 UTC     14:32 UTC     morning_handoff_backup
#   09:36 ET    13:36 UTC     14:36 UTC     morning_recovery
#
# Both UTC ticks fire year-round; the script's should_run_now() guard runs only
# the one whose ET wall-clock matches the expected window and skips the other.
#
# GitHub Actions (.github/workflows/overnight-reeval.yml) is the BACKUP only and
# runs at a LATER recovery window so it cannot race the Render primary. See that
# workflow's header for details.
#
# All endpoints these jobs call are idempotent at the admin-endpoint layer:
#   - /admin/overnight_reeval        : re-eval is read-then-arm; re-running is safe
#   - /admin/morning_handoff_audit   : auditing the same row twice is a no-op
#   - /admin/paper_rescue_restart_guard : WHERE-clause guard, rowcount=0 on re-run
#   - /admin/release_after_hours_deferred : status-transition guard, idempotent
#
# Each invocation runs the scheduler-agnostic unit of work:
#     python ap/scripts/live_morning_jobs.py
# The file entry point is intentional: importing it as ``ap.scripts...`` first
# executes ap/__init__.py and pulls in the database-bound trading runtime.
# which reads MORNING_JOB from env and calls the bot admin endpoints with HMAC.
#
# Secrets (set in Render dashboard, NOT committed) — names match the script
# (ap/scripts/live_morning_jobs.py reads os.getenv("BOT_URL") and
#  os.getenv("SIGNING_SECRET")):
#   BOT_URL          — bot admin base URL (live pod)
#   SIGNING_SECRET   — HMAC signing secret shared with the bot pod

services:
  # ── 09:18 ET — overnight_reeval_batch ──────────────────────────────────
  - type: cron
    name: ap-morning-overnight-reeval-edt
    runtime: python
    schedule: "18 13 * * 1-5"   # 13:18 UTC = 09:18 EDT
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python ap/scripts/live_morning_jobs.py"
    envVars:
      - { key: TZ, value: America/New_York }
      - { key: MORNING_JOB, value: overnight_reeval_batch }
      - { key: MORNING_JOB_EXECUTION_MODE, value: live }
      - { key: MORNING_JOB_CLIENT_ID, value: jasoncosby1@gmail.com }
      - { key: BOT_URL, sync: false }
      - { key: SIGNING_SECRET, sync: false }
  - type: cron
    name: ap-morning-overnight-reeval-est
    runtime: python
    schedule: "18 14 * * 1-5"   # 14:18 UTC = 09:18 EST
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python ap/scripts/live_morning_jobs.py"
    envVars:
      - { key: TZ, value: America/New_York }
      - { key: MORNING_JOB, value: overnight_reeval_batch }
      - { key: MORNING_JOB_EXECUTION_MODE, value: live }
      - { key: MORNING_JOB_CLIENT_ID, value: jasoncosby1@gmail.com }
      - { key: BOT_URL, sync: false }
      - { key: SIGNING_SECRET, sync: false }

  # ── 09:26 ET — morning_handoff_primary ─────────────────────────────────
