# render.yaml — Render Cron is the PRIMARY scheduler for market-open morning jobs.
#
# CRITICAL: Render evaluates cron expressions in UTC, NOT local time. Setting
# TZ=America/New_York affects the process clock but NOT when the cron fires.
# Schedules below are therefore expressed in UTC, with DUAL entries to cover
# both EDT (UTC-4) and EST (UTC-5). The script's own ET-window guard
# (should_run_now) runs the season-correct tick and skips the other.
#
# Premarket is staging/readiness only. The authoritative overnight evaluation
# begins when the regular session opens because the required Tradier market data
# is not reliably populated premarket.
#
#   Target ET   EDT (UTC-4)   EST (UTC-5)   MORNING_JOB
#   ─────────   ───────────   ───────────   ───────────
#   09:30 ET    13:30 UTC     14:30 UTC     overnight_reeval_batch
#   09:32 ET    13:32 UTC     14:32 UTC     morning_handoff_backup
#   09:36 ET    13:36 UTC     14:36 UTC     morning_recovery
#
# There is intentionally no independent morning_handoff_primary cron. A
# successful overnight reevaluation already invokes the post-overnight handoff
# and readiness path in-process. The 09:32 job is reconciliation-only backup.
# The 09:36 LIVE recovery reruns the canonical overnight evaluator, which again
# owns the handoff on successful completion.
#
# GitHub Actions (.github/workflows/overnight-reeval.yml) remains a later backup
# for a missed/delayed Render invocation.
#
# All called endpoints are idempotent at the admin-endpoint / DB-lock layer.
# No cron job here calls broker submit/cancel directly.
#
# Each invocation runs:
#     python -m ap.scripts.live_morning_jobs
# which reads MORNING_JOB from env and calls the bot admin endpoints with HMAC.
#
# Secrets (set in Render dashboard, NOT committed):
#   BOT_URL          — bot admin base URL (live pod)
#   SIGNING_SECRET   — HMAC signing secret shared with the bot pod

services:
  # ── 09:30 ET — authoritative overnight_reeval_batch ────────────────────
  - type: cron
    name: ap-morning-overnight-reeval-edt
    runtime: python
    schedule: "30 13 * * 1-5"   # 13:30 UTC = 09:30 EDT
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m ap.scripts.live_morning_jobs"
    envVars:
      - { key: TZ, value: America/New_York }
      - { key: MORNING_JOB, value: overnight_reeval_batch }
      - { key: MORNING_JOB_EXECUTION_MODE, value: live }
      - { key: MORNING_JOB_CLIENT_ID, value: jasoncosby1@gmail.com }
      - { key: MORNING_JOB_WINDOW_TOLERANCE_MINUTES, value: "10" }
      - { key: BOT_URL, sync: false }
      - { key: SIGNING_SECRET, sync: false }
  - type: cron
    name: ap-morning-overnight-reeval-est
    runtime: python
    schedule: "30 14 * * 1-5"   # 14:30 UTC = 09:30 EST
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m ap.scripts.live_morning_jobs"
    envVars:
      - { key: TZ, value: America/New_York }
      - { key: MORNING_JOB, value: overnight_reeval_batch }
      - { key: MORNING_JOB_EXECUTION_MODE, value: live }
      - { key: MORNING_JOB_CLIENT_ID, value: jasoncosby1@gmail.com }
      - { key: MORNING_JOB_WINDOW_TOLERANCE_MINUTES, value: "10" }
      - { key: BOT_URL, sync: false }
      - { key: SIGNING_SECRET, sync: false }

  # ── 09:32 ET — reconciliation-only handoff backup ──────────────────────
  - type: cron
    name: ap-morning-handoff-backup-edt
    runtime: python
    schedule: "32 13 * * 1-5"   # 13:32 UTC = 09:32 EDT
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m ap.scripts.live_morning_jobs"
    envVars:
      - { key: TZ, value: America/New_York }
      - { key: MORNING_JOB, value: morning_handoff_backup }
      - { key: MORNING_JOB_EXECUTION_MODE, value: live }
      - { key: MORNING_JOB_CLIENT_ID, value: jasoncosby1@gmail.com }
      - { key: MORNING_JOB_WINDOW_TOLERANCE_MINUTES, value: "10" }
      - { key: BOT_URL, sync: false }
      - { key: SIGNING_SECRET, sync: false }
  - type: cron
    name: ap-morning-handoff-backup-est
    runtime: python
    schedule: "32 14 * * 1-5"   # 14:32 UTC = 09:32 EST
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m ap.scripts.live_morning_jobs"
    envVars:
      - { key: TZ, value: America/New_York }
      - { key: MORNING_JOB, value: morning_handoff_backup }
      - { key: MORNING_JOB_EXECUTION_MODE, value: live }
      - { key: MORNING_JOB_CLIENT_ID, value: jasoncosby1@gmail.com }
      - { key: MORNING_JOB_WINDOW_TOLERANCE_MINUTES, value: "10" }
      - { key: BOT_URL, sync: false }
      - { key: SIGNING_SECRET, sync: false }

  # ── 09:36 ET — canonical LIVE recovery re-evaluation ───────────────────
  - type: cron
    name: ap-morning-recovery-edt
    runtime: python
    schedule: "36 13 * * 1-5"   # 13:36 UTC = 09:36 EDT
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m ap.scripts.live_morning_jobs"
    envVars:
      - { key: TZ, value: America/New_York }
      - { key: MORNING_JOB, value: morning_recovery }
      - { key: MORNING_JOB_EXECUTION_MODE, value: live }
      - { key: MORNING_JOB_CLIENT_ID, value: jasoncosby1@gmail.com }
      - { key: MORNING_JOB_WINDOW_TOLERANCE_MINUTES, value: "10" }
      - { key: BOT_URL, sync: false }
      - { key: SIGNING_SECRET, sync: false }
  - type: cron
    name: ap-morning-recovery-est
    runtime: python
    schedule: "36 14 * * 1-5"   # 14:36 UTC = 09:36 EST
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m ap.scripts.live_morning_jobs"
    envVars:
      - { key: TZ, value: America/New_York }
      - { key: MORNING_JOB, value: morning_recovery }
      - { key: MORNING_JOB_EXECUTION_MODE, value: live }
      - { key: MORNING_JOB_CLIENT_ID, value: jasoncosby1@gmail.com }
      - { key: MORNING_JOB_WINDOW_TOLERANCE_MINUTES, value: "10" }
      - { key: BOT_URL, sync: false }
      - { key: SIGNING_SECRET, sync: false }

  # -- 15:50 ET -- option chain archive capture (flag-off by default) -----
  - type: cron
    name: ap-chain-archive-close-edt
    runtime: python
    schedule: "50 19 * * 1-5"   # 19:50 UTC = 15:50 EDT
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m ap.chain_archiver"
    envVars:
      - { key: TZ, value: America/New_York }
      - { key: ENABLE_CHAIN_ARCHIVER, value: "false" }
      - { key: BOT_URL, sync: false }
      - { key: SIGNING_SECRET, sync: false }
  - type: cron
    name: ap-chain-archive-close-est
    runtime: python
    schedule: "50 20 * * 1-5"   # 20:50 UTC = 15:50 EST
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m ap.chain_archiver"
    envVars:
      - { key: TZ, value: America/New_York }
      - { key: ENABLE_CHAIN_ARCHIVER, value: "false" }
      - { key: BOT_URL, sync: false }
      - { key: SIGNING_SECRET, sync: false }