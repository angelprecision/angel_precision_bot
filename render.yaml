  # -- 15:50 ET -- option chain archive capture (flag-off by default) -----
  - type: cron
    name: ap-chain-archive-close-edt
    runtime: python
    schedule: "50 19 * * 1-5"   # 19:50 UTC = 15:50 EDT
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m ap.chain_archiver"
    envVars:
      - { key: TZ, value: America/New_York }
      - { key: ENABLE_CHAIN_ARCHIVER, value: "false" }
      - { key: BOT_URL, sync: false }
      - { key: SIGNING_SECRET, sync: false }
  - type: cron
